<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexNota +900</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;--grid:#E6F2EA;--ink:#14281D;--muted:#4B6356;--line:#CFE3D6;--card:#FFFFFF;
  --pen:#0E7A43;--marker:#0E7A43;--hl:#D8F3E2;--ok:#0B6B39;--okbg:#DDF4E6;--okline:#1F9D57;
  --bad:#B42318;--badbg:#FDE8E6;--badline:#D9433A;--c:#0E7A43;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;color:var(--ink);font:18px/1.7 "Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:#FFFFFF;color-scheme:light}
a{color:var(--pen)}
.mk{font-family:"Lexend",system-ui,sans-serif;font-weight:700;letter-spacing:-.02em}
#app{max-width:1040px;margin:0 auto;padding:28px 28px 60px}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.btn{font:inherit;font-size:.95rem;font-weight:600;border:2px solid var(--pen);background:var(--card);color:var(--pen);
  padding:.55em 1em;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.btn:hover{background:var(--hl)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.primary:hover{filter:brightness(1.1);background:var(--pen)}
.btn:disabled{opacity:.4;cursor:not-allowed;background:var(--card)}

/* home */
.hero{padding:30px 0 30px}
.hero h1{color:var(--marker);font-size:clamp(2.2rem,6.5vw,3.6rem);line-height:1.1;margin:0 0 16px;}
.lead{font-size:1.1rem;max-width:62ch;margin:0;color:var(--ink)}
.overall{display:flex;flex-wrap:wrap;gap:14px 34px;align-items:center;margin-top:26px;padding:18px 20px;background:var(--card);border:2px solid var(--line);border-radius:14px}
.overall div{display:flex;align-items:baseline;gap:8px}
.overall strong{font-size:1.9rem;line-height:1}
.overall span{color:var(--muted)}
.obtns{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:10px}
.subj{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:6px 14px 14px 6px;padding:18px 18px 16px;display:flex;flex-direction:column}
.subj h2{margin:0 0 8px;font-size:1.25rem;font-weight:600}
.subj h2 a{color:var(--ink);text-decoration:none}
.subj h2 a:hover{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:3px}
.subj>p{margin:0 0 14px;color:var(--muted);font-size:.94rem;flex:1}
.bar{height:8px;background:var(--grid);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.meta{font-size:.85rem;color:var(--muted);margin:6px 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;font-weight:700}
.acts a{text-underline-offset:3px}
.foot{margin-top:40px;color:var(--muted);font-size:.9rem}

/* subject */
.crumb{margin-bottom:6px}
.crumb a{font-weight:700;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.shead h1{color:var(--pen);font-size:clamp(2rem,6vw,3rem);margin:10px 0 10px;line-height:1.1;}
.tabs{display:flex;gap:4px;margin:26px 0 20px;border-bottom:2px solid var(--pen);overflow-x:auto}
.tabs a{padding:.6em 1em;font-weight:700;color:var(--muted);text-decoration:none;border:2px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;white-space:nowrap;margin-bottom:-2px}
.tabs a[aria-selected="true"]{color:#fff;background:var(--pen);border-color:var(--pen);border-bottom:2px solid var(--pen)}
.tabs a:hover{color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted)}

.topic{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.topic summary{cursor:pointer;padding:16px 18px;font-weight:600;font-size:1.08rem;display:flex;gap:12px;align-items:baseline;list-style:none}
.topic summary::-webkit-details-marker{display:none}
.topic summary::after{content:"+";margin-left:auto;font-size:1.3rem;line-height:1;color:var(--muted)}
.topic[open] summary::after{content:"−"}
.tn{color:var(--c);font-weight:700;min-width:1.4em}
.tb{padding:0 18px 18px 50px;max-width:78ch}
.tb p{margin:0 0 10px}
.tb ul{margin:0 0 12px;padding-left:1.2em}
.tb li{margin-bottom:6px}
.fx{margin-top:6px}
.fxl{font-size:.88rem;color:var(--muted);margin:0 0 6px!important}
.fx code{display:inline-block;margin:0 8px 8px 0;padding:4px 10px;font:600 1rem "Lexend",sans-serif;background:var(--hl);border-radius:3px}
.next{margin-top:22px}

/* study */
.study{display:grid;grid-template-columns:1fr 290px;gap:22px;align-items:start}
@media (max-width:760px){.study{grid-template-columns:1fr}.side{order:-1}}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.block h3{margin:0 0 4px;font-size:1.08rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.block h3 .bn{font-weight:700;color:var(--c)}
.dur{font-size:.85rem;font-weight:400;color:var(--muted)}
.block ul{list-style:none;margin:8px 0 0;padding:0}
.block li{margin:4px 0}
.block label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:4px 0}
.block input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex:none}
.block input:checked+span{text-decoration:line-through;color:var(--muted)}
.sprog{margin-bottom:14px;color:var(--muted)}
.sprog strong{color:var(--ink)}
.side>*{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.timer{text-align:center}
.tl{font-weight:700;color:var(--muted)}
.tt{font-size:3.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.trow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tmode{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tmode button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--muted);padding:.3em .8em;border-radius:99px;cursor:pointer}
.tmode button[aria-pressed="true"]{background:var(--pen);color:#fff;border-color:var(--pen)}
.tip strong{display:block;margin-bottom:4px}
.tip p{margin:0;font-size:.95rem}

/* quiz */
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px}
.sc{display:flex;align-items:baseline;gap:6px;color:var(--muted)}
.sc strong{font-size:1.5rem;color:var(--ink)}
.sc.ok strong{color:var(--ok)}
.sc.bad strong{color:var(--bad)}
.sa{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.q{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;transition:border-color .2s}
.q.is-ok{border-color:var(--okline)}
.q.is-bad{border-color:var(--badline)}
.qh{margin:0 0 6px;font-weight:700;color:var(--muted);font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{background:var(--hl);color:var(--ink);padding:1px 8px;border-radius:99px;font-size:.8rem}
.en{margin:0 0 16px;font-size:1.08rem;font-weight:500;max-width:75ch}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;padding:10px 14px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;font-size:.9rem}
.opt span{padding-top:2px}
.opt:not(:disabled):hover{border-color:var(--ink);background:var(--card)}
.opt:disabled{cursor:default;opacity:1}
.opt.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok);font-weight:700}
.opt.ok b{background:var(--okline);border-color:var(--okline);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--badline);color:var(--bad);font-weight:700}
.opt.bad b{background:var(--badline);border-color:var(--badline);color:#fff}
.opt.dim{opacity:.55}
.ex{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.97rem;max-width:75ch}
.q.is-ok .ex{background:var(--okbg)}
.q.is-bad .ex{background:var(--badbg)}
.q.is-ok .ex strong{color:var(--ok)}
.q.is-bad .ex strong{color:var(--bad)}
.stamp-wrap{text-align:center;padding:30px 10px 10px}
.stamp{display:inline-block;color:var(--pen);font-size:clamp(1.6rem,5vw,2.4rem);margin:0 0 8px;border:4px solid var(--pen);padding:6px 22px;border-radius:10px;line-height:1.15}
.stamp.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(1.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp.pop{animation:none}*{transition:none!important}}
@media (max-width:560px){#app{padding:18px 14px 50px}.tb{padding:0 16px 16px}.overall .btn{margin-left:0}.sa{margin-left:0}.tt{font-size:2.8rem}}
/* estudos */
.fig{margin:0 0 22px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.fig svg{width:100%;height:auto;display:block;font-family:"Lexend",system-ui,sans-serif;overflow:visible}
@media (max-width:640px){.fig{padding:12px;overflow-x:auto}.fig svg{min-width:600px}.fig figcaption{position:sticky;left:0}}
.fig figcaption{font-size:.9rem;color:var(--muted);margin-top:12px;text-align:center}
.tI{fill:var(--ink)}.tW{fill:#fff}.tM{fill:var(--muted)}.tG{fill:var(--pen)}.tB{fill:var(--bad)}.tBl{fill:#6D5BD0}
.bG{fill:var(--pen)}.bL{fill:var(--hl)}.bC{fill:var(--card);stroke:var(--line);stroke-width:2}.bC0{fill:var(--card)}
.bLine{fill:var(--line)}.bSh{fill:var(--muted);opacity:.45}.bSh2{fill:var(--muted)}.bInk{fill:var(--ink)}
.bCold{fill:#60A5FA;opacity:.22}.bHot{fill:#F59E0B;opacity:.3}
.sG{stroke:var(--pen);fill:none;stroke-width:3}.sL{stroke:var(--line);fill:none;stroke-width:2}
.sSm{fill:none;stroke:var(--muted);stroke-width:7;stroke-linecap:round;opacity:.55}
.reader{display:grid;grid-template-columns:250px 1fr;gap:28px;align-items:start}
@media (max-width:820px){.reader{grid-template-columns:1fr}.pindex{order:2}}
.pindex{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
@media (max-width:820px){.pindex{position:static}}
.pil{font-weight:600;margin:0 0 8px}
.pindex ol,.toc{margin:0;padding-left:1.4em}
.pindex li,.toc li{margin:6px 0;font-size:.93rem}
.pindex a,.toc a{color:var(--ink);text-decoration:none}
.pindex a:hover,.toc a:hover{color:var(--pen);text-decoration:underline}
.pindex a[aria-current]{color:var(--pen);font-weight:700}
.pindex a.read::after,.toc a.read::after{content:" ✓";color:var(--pen);font-weight:700}
.toc{margin-bottom:14px;flex:1}
.pprog{margin:12px 0 0;font-size:.88rem;color:var(--muted)}
.rtop{display:flex;align-items:center;gap:14px;color:var(--muted);font-weight:600;margin-bottom:14px}
.pbar{flex:1;height:8px;background:var(--grid);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pen)}
.page h2{font-size:clamp(1.5rem,4vw,2rem);margin:0 0 18px;line-height:1.25;color:var(--ink)}
.page>p{max-width:68ch;margin:0 0 14px}
.remember{background:var(--hl);border-left:6px solid var(--pen);border-radius:10px;padding:14px 18px;margin-top:20px}
.remember strong{color:var(--pen)}
.remember p{margin:4px 0 0}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.ghint{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--pen);border-radius:12px;padding:14px 18px;margin-bottom:20px}
.ghint strong{color:var(--pen)}.ghint p{margin:4px 0 0;font-size:.95rem;max-width:75ch}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.gi{margin:0}.gload{color:var(--muted);font-weight:600;margin:0 0 14px}
.gb{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in}
.gb:hover{border-color:var(--pen)}
.gb img{display:block;width:100%;height:auto}
.gi figcaption{font-size:.9rem;font-weight:600;margin-top:8px;line-height:1.35}
#lb{position:fixed;inset:0;z-index:50;background:rgba(8,28,18,.86);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.lbin{width:100%;max-width:720px;max-height:100%;display:flex;flex-direction:column;gap:10px}
.lbin img{align-self:center;max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;border-radius:10px;background:#fff}
.lbtop,.lbnav{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;font-weight:600}
.lbh{font-size:.82rem;color:#CDEFD9;text-align:center;font-weight:400}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:8px}.sh h2,.sh h1{margin:0!important}
.ico{flex:none;width:46px;height:46px;padding:9px;border-radius:12px;background:var(--hl);color:var(--pen)}
.sh.big{margin:10px 0 10px}.sh.big .ico{width:62px;height:62px;padding:12px;border-radius:16px}
.tfig{margin:4px 0 16px;max-width:680px}
.shell{display:grid;grid-template-columns:272px 1fr;min-height:100%}
#nav{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px 30px}
.content{min-width:0}
.topbar{display:none}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;padding:4px 10px 16px}
.bn{font-size:1.55rem;font-weight:800;color:var(--ink);letter-spacing:-.03em}
.bb{background:var(--pen);color:#fff;font-weight:800;font-size:.95rem;padding:3px 9px;border-radius:8px}
.me{background:var(--hl);border-radius:12px;padding:12px 14px;margin:0 4px 14px}
.me b{display:block;color:var(--pen);font-size:1.1rem}.me small{color:var(--muted);font-size:.8rem}
.me .bar{margin-top:8px;background:#fff}
#nav nav{display:flex;flex-direction:column;gap:2px}
.nl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.93rem;font-weight:500}
.nl:hover{background:var(--hl)}
.nl.on{background:var(--pen);color:#fff}
.nl.on .ico{background:rgba(255,255,255,.18);color:#fff}
.nl small{margin-left:auto;font-size:.75rem;opacity:.75}
.ni{width:20px;height:20px;flex:none}
.ico.xs{width:26px;height:26px;padding:5px;border-radius:7px}
.ico.sm{width:30px;height:30px;padding:6px;border-radius:8px}
.ng{margin:16px 10px 4px;font-size:.78rem;font-weight:700;color:var(--muted)}
@media (max-width:900px){
 .shell{display:block}
 .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
 .topbar .brand{padding:0}.topbar .bn{font-size:1.25rem}
 #tpts{margin-left:auto;font-weight:700;color:var(--pen);font-size:.9rem}
 #menu{font:inherit;font-weight:600;border:2px solid var(--pen);background:#fff;color:var(--pen);border-radius:10px;padding:.35em .8em}
 #nav{position:fixed;inset:0 auto 0 0;width:290px;max-width:85vw;z-index:40;height:100%;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
 body.navopen #nav{transform:none}
 body.navopen::after{content:"";position:fixed;inset:0;background:rgba(8,28,18,.4);z-index:30}
}
.kick{margin:0 0 4px;font-weight:700;color:var(--pen);font-size:.9rem}
.dhead{padding:8px 0 18px}.dhead h1{margin:0 0 10px;font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.15;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tile span{color:var(--muted);font-size:.88rem;font-weight:500}
.tile strong{font-size:1.9rem;line-height:1.1}.tile strong.sm{font-size:1.4rem}.tile strong em{font-style:normal;font-size:1rem;color:var(--muted);font-weight:500}
.tile small{color:var(--muted);font-size:.82rem}
.tile.xp{background:var(--pen);border-color:var(--pen);color:#fff}.tile.xp span,.tile.xp small{color:#CDEFD9}
.tile.xp .bar{background:rgba(255,255,255,.25);margin:6px 0 2px}.tile.xp .bar i{background:#fff}
.lvl b{font-size:.9rem}
.next-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between;background:var(--hl);border-radius:16px;padding:18px 22px;margin-bottom:18px}
.next-card h2{margin:0 0 4px;font-size:1.25rem}.next-card p{margin:0;max-width:60ch}
.panel,.area{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px}
.area{background:transparent;border:none;padding:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{margin:0;font-size:1.3rem}.ph span,.ph a{color:var(--muted);font-size:.9rem;font-weight:600}.ph a{color:var(--pen)}
.erow{display:grid;grid-template-columns:190px 1fr 56px;gap:12px;align-items:center;margin:10px 0}
@media (max-width:560px){.erow{grid-template-columns:1fr 50px}.erow .en2{grid-column:1/-1;margin-bottom:-6px}}
.en2{font-weight:600;font-size:.95rem}
.ebar{position:relative;height:14px;background:var(--grid);border-radius:99px}
.ebar i{display:block;height:100%;background:var(--pen);border-radius:99px}
.ebar .goal{position:absolute;left:90%;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.erow strong{text-align:right;font-size:1.1rem}
.note{font-size:.83rem;color:var(--muted);margin:12px 0 0}
.subj .sh{align-items:flex-start}.subj h3{margin:0;font-size:1.15rem}.subj h3 a{color:var(--ink);text-decoration:none}.subj h3 a:hover{color:var(--pen)}
.sp{font-size:.82rem;color:var(--pen);font-weight:700}
.ring{margin-left:auto;flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:radial-gradient(closest-side,#fff 76%,transparent 78%),conic-gradient(var(--pen) calc(var(--v)*1%),var(--grid) 0)}
.mini{display:flex;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-bottom:12px}.mini b{color:var(--ink)}
.acts a{font-size:.88rem}
.tbl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.95rem}
.tr:hover{background:var(--hl)}.th{border-top:none;color:var(--muted);font-size:.82rem;font-weight:700}.th:hover{background:none}
.tn2{display:flex;align-items:center;gap:8px;font-weight:600}
.good{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
@media (max-width:560px){.tr{grid-template-columns:1.6fr 1fr 1fr;}.tr span:nth-child(4),.tr span:nth-child(5){display:none}}
/* ===== NexNota v2 ===== */
:root{--sh:0 1px 2px rgba(16,40,28,.05),0 6px 20px rgba(16,40,28,.06);--g1:#0E7A43;--g2:#15A05A}
body{background:#fff}
#app{max-width:1120px;padding:24px 32px 64px}
@media (max-width:640px){#app{padding:18px 14px 50px}}

@media (max-width:900px){.topbar{padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;flex-wrap:wrap}#menu{display:inline-block}.topbar .brand{display:flex}.search{order:5;flex-basis:100%;max-width:none}.chip.ghost{display:none}}

.stop h3{margin:0;font-size:1.2rem}.stop h3 a{color:var(--ink);text-decoration:none}.stop h3 a:hover{color:var(--g1)}

.sbt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sbt .btn{text-align:center}
.ring{width:54px;height:54px}

.sban{display:flex;gap:20px;align-items:center;background:linear-gradient(135deg,#0B6B3A,#0E7A43 50%,#18A55D);color:#fff;border-radius:24px;padding:26px 28px;margin-bottom:18px;flex-wrap:wrap}
.sbi .ico.w{width:72px;height:72px;padding:16px;border-radius:20px;background:rgba(255,255,255,.16)}
.sbt2{flex:1;min-width:240px}.sbt2 h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,2.4rem);color:#fff}.sbt2 p:last-child{margin:0;color:#E6F7EC;font-size:.95rem;max-width:62ch}
.sbs{display:flex;gap:10px}.sbs div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;text-align:center;min-width:84px}.sbs strong{display:block;font-size:1.3rem}.sbs span{font-size:.75rem;color:#CDEFD9}
.tabs2{display:flex;gap:6px;background:#F2F7F4;padding:6px;border-radius:16px;margin-bottom:22px;overflow-x:auto}
.tabs2 a{display:flex;align-items:center;gap:8px;padding:.6em 1em;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
.tabs2 a .ti{width:18px;height:18px}
.tabs2 a:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.tabs2 a[aria-selected="true"]{background:#fff;color:var(--g1);box-shadow:0 1px 3px rgba(16,40,28,.12)}
/* páginas gerais */
.shead,.dhead{background:linear-gradient(135deg,#F1FAF4,#E3F5EA);border:1px solid #D6EADD;border-radius:22px;padding:24px 26px;margin-bottom:22px}
.shead h1,.dhead h1{color:var(--ink)!important;font-size:clamp(1.7rem,4vw,2.3rem)!important;margin:0 0 8px!important}
.shead .lead,.dhead .lead{font-size:1rem}
.crumb{display:none}
.panel{border-radius:20px;box-shadow:var(--sh);border-color:#E4EEE8}
.tile{border-radius:18px;box-shadow:var(--sh);border-color:#E4EEE8}
.tile.xp{background:linear-gradient(135deg,var(--g1),var(--g2))}
.subj,.topic,.block,.q,.gb,.fig,.pindex{border-color:#E4EEE8}
.topic,.q,.block{border-radius:18px;box-shadow:var(--sh)}
.q{border-width:2px}
.score{border:1px solid #E4EEE8;box-shadow:0 6px 24px rgba(16,40,28,.08);border-radius:16px}
.side>*{border:1px solid #E4EEE8;box-shadow:var(--sh);border-radius:18px}
.gb{border-radius:16px;box-shadow:var(--sh)}
.fig{border-radius:18px}
.remember{border-radius:14px}
.foot{text-align:center}
@media (max-width:560px){.erow{grid-template-columns:1fr 50px}.erow .en2{grid-column:1/-1;margin-bottom:-6px}
.sban{padding:20px;gap:14px}.sbi .ico.w{width:52px;height:52px;padding:11px;border-radius:15px}.sbt2 p:last-child{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.sbs{width:100%}.sbs div{flex:1;min-width:0}
.ringbig{width:120px;height:120px}.ringbig strong{font-size:1.8rem}.hb .btn{flex:1;text-align:center}}
</style>
