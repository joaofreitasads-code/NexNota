<script>
const D=[
{id:"matematica",n:"Matemática",g:"a",c:"#0E7A43",fl:"Fórmulas essenciais",
d:"Um material direto ao ponto para você dominar os conteúdos mais cobrados em Matemática no ENEM. Com explicações simples, fórmulas essenciais e revisões estratégicas, fica mais fácil entender os cálculos e ganhar tempo na hora da prova.",
dica:"A prova de Matemática é a última do segundo dia. Faça primeiro as questões de porcentagem, leitura de gráficos e escala, que são rápidas, e deixe geometria espacial e funções para depois.",
t:[
["Razão, proporção e porcentagem","É o assunto mais cobrado da prova. Quase toda questão de cotidiano (preço, receita, mistura, consumo) é resolvida com regra de três ou porcentagem.",["Grandezas diretamente proporcionais crescem juntas; inversamente proporcionais, uma cresce e a outra diminui (velocidade e tempo).","Aumentos e descontos sucessivos não se somam: multiplique os fatores. Aumento de 10% seguido de desconto de 10% dá 0,99 do valor inicial.","Porcentagem de porcentagem: 20% de 50% = 0,2 × 0,5 = 10%."],["Aumento de i%: valor × (1 + i)","Desconto de i%: valor × (1 − i)","a/b = c/d  ⇒  a·d = b·c"]],
["Escalas e unidades de medida","O ENEM adora mapas, plantas de casas e maquetes. A escala relaciona o tamanho no desenho com o tamanho real, sempre na mesma unidade.",["Escala 1:50.000 significa que 1 cm no mapa vale 50.000 cm (500 m) no real.","Na área, a escala vai ao quadrado; no volume, ao cubo.","Conversões que mais caem: 1 km = 1.000 m; 1 m² = 10.000 cm²; 1 m³ = 1.000 L; 1 dm³ = 1 L."],["E = medida no desenho / medida real","km/h ÷ 3,6 = m/s"]],
["Estatística","Aparece em quase toda prova com tabelas e gráficos. Saber a diferença entre média, mediana e moda resolve a maioria das questões.",["Média: soma dos valores dividida pela quantidade.","Mediana: valor central com os dados em ordem crescente. Com quantidade par, é a média dos dois centrais.","Moda: valor que mais se repete.","Desvio padrão mede a regularidade: quanto menor, mais homogêneos são os dados."],["Média = (x₁ + x₂ + … + xₙ) / n","Média ponderada = Σ(valor × peso) / Σpesos"]],
["Análise combinatória e probabilidade","A dica é identificar se a ordem importa. Se importa, é arranjo ou permutação; se não importa (grupos, comissões), é combinação.",["Princípio fundamental da contagem: multiplique as possibilidades de cada etapa.","Permutação com repetição: divida pelo fatorial das repetições (anagramas de ARARA).","Probabilidade de eventos independentes simultâneos: multiplique as probabilidades."],["P = casos favoráveis / casos possíveis","Pₙ = n!","C(n,p) = n! / [p!(n − p)!]","A(n,p) = n! / (n − p)!"]],
["Geometria plana","Áreas e perímetros em terrenos, pisos, embalagens e plantas. O Teorema de Pitágoras aparece em rampas, escadas e telhados.",["Triângulo retângulo 3-4-5 e seus múltiplos (6-8-10) aparecem muito.","Semelhança de triângulos resolve questões de sombra e altura.","Soma dos ângulos internos de um polígono: (n − 2) × 180°."],["Retângulo: A = b·h","Triângulo: A = b·h/2","Círculo: A = πr²  e  C = 2πr","Trapézio: A = (B + b)·h/2","a² = b² + c²"]],
["Geometria espacial","Volume de caixas d'água, embalagens, piscinas e silos. Lembre de converter m³ em litros no final.",["Prisma e cilindro: área da base vezes altura.","Pirâmide e cone: um terço do volume do prisma ou cilindro de mesma base e altura.","Planificação de sólidos também cai: saiba reconhecer cubo, prisma, pirâmide e cilindro abertos."],["Prisma/cilindro: V = A_base · h","Cilindro: V = πr²h","Cone/pirâmide: V = A_base · h / 3","Esfera: V = 4πr³/3"]],
["Funções","Função do 1º grau modela tarifas fixas mais valor variável. Função do 2º grau modela lucro, altura de lançamentos e áreas máximas.",["Na função afim, a é a taxa de variação e b é o valor inicial (taxa fixa).","Na quadrática, o vértice dá o máximo (a < 0) ou o mínimo (a > 0).","Função exponencial aparece em crescimento populacional, juros e decaimento de medicamentos."],["f(x) = ax + b","f(x) = ax² + bx + c","xᵥ = −b/2a   e   yᵥ = −Δ/4a","Δ = b² − 4ac"]],
["Matemática financeira e progressões","Juros compostos rendem juros sobre juros. Progressões aparecem em padrões de figuras, economias mensais e empilhamentos.",["Juros simples crescem em linha reta (PA); compostos crescem de forma exponencial (PG).","Em PA, cada termo soma a razão; em PG, cada termo multiplica a razão."],["Juros simples: J = C·i·t","Juros compostos: M = C(1 + i)ᵗ","PA: aₙ = a₁ + (n − 1)r   e   Sₙ = (a₁ + aₙ)n/2","PG: aₙ = a₁·qⁿ⁻¹"]]
],
s:[
["Base numérica",50,["Reler o resumo de razão, proporção e porcentagem","Resolver 10 questões de porcentagem e regra de três","Anotar no caderno de erros cada questão errada e o motivo"]],
["Estatística e gráficos",50,["Revisar média, mediana, moda e desvio padrão","Interpretar 5 gráficos ou tabelas de provas anteriores","Fazer as questões 3 e 8 desta apostila de novo sem olhar a resolução"]],
["Geometria",60,["Escrever de memória as fórmulas de área e volume","Resolver 8 questões de geometria plana e espacial","Conferir as conversões de unidade (m³ para litros)"]],
["Funções, combinatória e probabilidade",50,["Revisar vértice da parábola e taxa de variação","Resolver 6 questões de probabilidade e contagem","Explicar em voz alta quando a ordem importa e quando não importa"]],
["Simulado cronometrado",60,["Resolver 15 questões mistas com no máximo 3 minutos cada","Corrigir e classificar os erros: conta, interpretação ou conteúdo","Refazer as erradas no dia seguinte"]]
],
q:[
["Uma loja aumentou em 10% o preço de um produto que custava R$ 200,00. Uma semana depois, anunciou um desconto de 10% sobre o novo preço. Qual é o preço final?",["R$ 200,00","R$ 198,00","R$ 196,00","R$ 202,00","R$ 180,00"],1,"Aumento: 200 × 1,1 = 220. Desconto: 220 × 0,9 = 198. Aumentos e descontos sucessivos se multiplicam (1,1 × 0,9 = 0,99), então não se anulam."],
["Em um mapa de escala 1:500.000, duas cidades estão a 4 cm de distância. Qual é a distância real entre elas?",["2 km","20 km","200 km","50 km","5 km"],1,"4 cm × 500.000 = 2.000.000 cm. Dividindo por 100.000 (cm em 1 km), temos 20 km."],
["As notas de um aluno em cinco provas foram 6, 8, 8, 9 e 4. A mediana e a moda dessas notas são, respectivamente:",["7 e 8","8 e 8","8 e 7","7 e 7","6 e 8"],1,"Em ordem: 4, 6, 8, 8, 9. O valor central (mediana) é 8 e o valor que mais se repete (moda) também é 8. A média seria 35 ÷ 5 = 7, que é uma pegadinha comum."],
["Um dado comum de seis faces é lançado uma vez. Qual é a probabilidade de sair um número primo?",["1/6","1/3","1/2","2/3","5/6"],2,"Os primos entre 1 e 6 são 2, 3 e 5: três casos favoráveis em seis possíveis, ou seja, 3/6 = 1/2. Lembre que 1 não é primo."],
["De um grupo de 6 estudantes, será formada uma comissão de 3 pessoas. Quantas comissões diferentes são possíveis?",["18","20","120","216","60"],1,"Em comissão a ordem não importa, então é combinação: C(6,3) = 6! / (3!·3!) = 720 / 36 = 20. O valor 120 seria um arranjo, em que a ordem importaria."],
["Uma caixa d'água cilíndrica tem raio de 1 m e altura de 2 m. Usando π = 3, qual é sua capacidade em litros?",["600 L","2.000 L","3.000 L","6.000 L","12.000 L"],3,"V = πr²h = 3 × 1² × 2 = 6 m³. Como 1 m³ = 1.000 L, a capacidade é 6.000 L."],
["Uma pessoa aplicou R$ 1.000,00 a juros compostos de 10% ao mês. Qual será o montante após 2 meses?",["R$ 1.200,00","R$ 1.210,00","R$ 1.100,00","R$ 1.221,00","R$ 1.020,00"],1,"M = 1000 × 1,1² = 1000 × 1,21 = 1.210. Em juros simples o resultado seria 1.200, porque não haveria juros sobre juros."],
["O lucro de uma pequena fábrica é dado por L(x) = −x² + 40x − 300, em que x é a quantidade de peças vendidas. Qual quantidade gera o lucro máximo?",["10","20","30","40","300"],1,"Como a < 0, a parábola tem ponto de máximo no vértice: xᵥ = −b/2a = −40 / (2 × (−1)) = 20 peças."]
]},

{id:"portugues",n:"Português",g:"o",c:"#15803D",
d:"Um guia prático para melhorar sua interpretação e dominar os pontos de Português que mais aparecem no ENEM. Com resumos organizados, você revisa gramática, funções da linguagem, crase, sintaxe e compreensão textual sem perder tempo com conteúdo confuso.",
dica:"O ENEM quase nunca pede regra decorada isolada. Leia o enunciado antes do texto para saber o que procurar, e desconfie de alternativas com palavras absolutas como sempre, nunca e apenas.",
t:[
["Interpretação de texto","É a base de toda a prova de Linguagens. A questão pede o que o texto diz ou permite concluir, não a sua opinião.",["Identifique a tese (ideia principal) e os argumentos que a sustentam.","Inferência é o que está implícito, mas autorizado pelo texto. Extrapolação vai além do texto e costuma ser a alternativa errada.","Observe quem escreveu, para quem, onde e com qual objetivo."]],
["Gêneros e tipos textuais","Tipo é a estrutura (narrar, descrever, argumentar, expor, instruir). Gênero é o texto real que circula na sociedade.",["Gêneros frequentes no ENEM: charge, tirinha, crônica, anúncio publicitário, artigo de opinião, infográfico, receita, post de rede social.","Charge critica um fato atual com humor; cartum trata de temas atemporais.","Texto injuntivo usa verbos no imperativo para orientar o leitor (manuais, receitas)."]],
["Funções da linguagem","Cada texto tem uma função predominante, ligada ao elemento da comunicação que recebe mais destaque.",["Referencial: foco na informação, 3ª pessoa, objetividade (notícias).","Emotiva: foco no emissor, 1ª pessoa, sentimentos (diários).","Conativa ou apelativa: foco no receptor, imperativo, convencimento (propagandas).","Fática: foco no canal, testa ou mantém o contato (alô, tá me ouvindo?).","Metalinguística: o código explica o próprio código (dicionário, poema sobre poesia).","Poética: foco na forma da mensagem, sonoridade e ritmo."],["Referencial = informação","Emotiva = emissor","Conativa = receptor","Fática = canal","Metalinguística = código","Poética = mensagem"]],
["Variação linguística","Um dos temas mais recorrentes. O ENEM defende que todas as variedades são legítimas e combate o preconceito linguístico.",["Regional (diatópica): sotaques e vocabulário de cada região.","Social (diastrática): idade, grupo social, profissão (gírias e jargões).","Histórica (diacrônica): mudanças da língua ao longo do tempo.","Situacional (diafásica): adequação ao contexto, formal ou informal.","Não existe certo ou errado absoluto, mas adequado ou inadequado à situação."]],
["Figuras de linguagem","Recursos de sentido e expressividade presentes em poemas, anúncios e letras de música.",["Metáfora: comparação implícita (ela é uma flor).","Metonímia: substituição por relação lógica (ler Machado de Assis = ler a obra dele).","Ironia: dizer o contrário do que se pensa.","Hipérbole: exagero. Eufemismo: suavização.","Antítese: ideias opostas. Paradoxo: ideias opostas que parecem impossíveis juntas.","Prosopopeia: dar características humanas a seres não humanos."]],
["Crase","É a fusão da preposição a com o artigo feminino a. Só existe quando o termo regente exige a preposição e a palavra seguinte aceita o artigo.",["Use antes de palavra feminina quando o verbo ou nome pede a preposição a (vou à escola, refiro-me à aula).","Não use antes de palavra masculina, verbo, pronome pessoal, artigo indefinido nem em expressões com palavras repetidas (cara a cara).","Locuções femininas levam crase: às vezes, à noite, à medida que."],["Vou a, volto da: crase há","Vou a, volto de: crase pra quê?"]],
["Sintaxe e coesão","O ENEM cobra sintaxe pelo sentido, principalmente o valor dos conectivos que ligam as orações.",["Adversativos (mas, porém, contudo): oposição.","Concessivos (embora, ainda que, mesmo que): oposição que não impede o fato.","Causais (porque, já que, visto que): causa. Conclusivos (portanto, logo, assim): conclusão.","Finais (para que, a fim de que): finalidade. Condicionais (se, caso): condição.","Pronomes e sinônimos retomam termos e evitam repetição (coesão referencial)."]],
["Redação do ENEM","Texto dissertativo-argumentativo sobre um problema social, com nota de 0 a 1000 dividida em cinco competências de 200 pontos.",["C1: domínio da norma-padrão. C2: compreensão do tema e repertório. C3: seleção e organização dos argumentos.","C4: coesão, uso de conectivos. C5: proposta de intervenção que respeite os direitos humanos.","Estrutura segura: introdução com tese, dois parágrafos de desenvolvimento e conclusão com proposta."],["Proposta completa: Agente, Ação, Meio/Modo, Finalidade e Detalhamento"]]
],
s:[
["Leitura e interpretação",45,["Ler 2 textos de gêneros diferentes e escrever a tese de cada um em uma frase","Resolver 8 questões de interpretação de provas anteriores","Anotar por que cada alternativa errada estava errada"]],
["Funções da linguagem e variação",45,["Montar um quadro com as seis funções e um exemplo de cada","Resolver 6 questões de variação linguística","Encontrar um anúncio real e dizer qual função predomina"]],
["Gramática aplicada",50,["Revisar crase e conectivos pelo resumo","Escrever 5 frases com crase obrigatória e 5 em que ela é proibida","Classificar o valor dos conectivos em um editorial de jornal"]],
["Redação",60,["Escolher um tema de prova anterior e escrever a introdução com tese","Escrever a conclusão com os cinco elementos da proposta de intervenção","Conferir o texto contra as cinco competências"]]
],
q:[
["Em uma campanha pública lê-se: “Vacine-se! Proteja quem você ama.” A função da linguagem predominante nesse texto é a:",["referencial","emotiva","conativa","fática","metalinguística"],2,"O texto se dirige ao leitor com verbos no imperativo (vacine-se, proteja) para convencê-lo a agir. Esse foco no receptor caracteriza a função conativa ou apelativa."],
["Um verbete de dicionário que define o significado da palavra “palavra” exemplifica a função:",["poética","metalinguística","fática","referencial","emotiva"],1,"Quando a língua é usada para explicar a própria língua, o código fala do código: essa é a função metalinguística."],
["Assinale a frase em que o uso do acento grave (crase) está correto:",["Comecei à estudar cedo.","Voltamos à pé para casa.","Refiro-me à professora nova.","Entreguei a carta à ele.","Assisti à um filme ótimo."],2,"Quem se refere, refere-se a algo, e professora aceita o artigo a, formando à. Não há crase antes de verbo (estudar), palavra masculina (pé), pronome pessoal (ele) nem artigo indefinido (um)."],
["Na frase “Embora estivesse cansado, o candidato terminou a prova”, o conectivo destacado estabelece relação de:",["causa","conclusão","concessão","adição","finalidade"],2,"Embora introduz um fato contrário (o cansaço) que não impede a ação principal (terminar a prova). Essa é a relação de concessão."],
["Na frase “Nas férias, li Machado de Assis inteiro”, a figura de linguagem presente é a:",["metáfora","metonímia","ironia","antítese","eufemismo"],1,"O nome do autor substitui a obra dele. Essa troca baseada em uma relação lógica (autor pela obra) é a metonímia."],
["Um texto reproduz a fala de uma personagem: “A gente vamo lá amanhã cedo, uai.” Segundo a perspectiva cobrada no ENEM, esse registro evidencia:",["um erro gramatical que deve ser corrigido","uma variedade regional da língua, legítima em seu contexto","uma linguagem usada apenas por quem não estudou","um jargão técnico profissional","o uso da norma-padrão escrita"],1,"O uai e a concordância marcam uma variedade regional e informal. O ENEM trata as variedades como legítimas e critica o preconceito linguístico."],
["O verso de Camões “É dor que desatina sem doer” apresenta a figura de linguagem chamada:",["hipérbole","paradoxo","eufemismo","prosopopeia","metonímia"],1,"Uma dor que não dói reúne ideias contraditórias que parecem impossíveis ao mesmo tempo. Isso é paradoxo, que vai além da simples oposição da antítese."],
["Na redação do ENEM, a proposta de intervenção para o problema discutido é avaliada principalmente na competência:",["1","2","3","4","5"],4,"A Competência 5 avalia a proposta de intervenção, que deve ter agente, ação, meio ou modo, finalidade e detalhamento, respeitando os direitos humanos."]
]},

{id:"literatura",n:"Literatura",g:"a",c:"#1B8A4B",
d:"Um material direto para você entender as escolas literárias sem decorar tudo no desespero. Aprenda os períodos, autores, obras e características mais cobradas no ENEM, com resumos claros para facilitar sua revisão antes da prova.",
dica:"O ENEM traz um trecho e pede a característica da escola. Em vez de decorar datas, associe cada escola a duas ou três marcas fortes e a um autor principal.",
t:[
["Quinhentismo","Primeiras produções escritas sobre o Brasil, no século XVI.",["Literatura de informação: textos de viajantes descrevendo a terra, como a Carta de Pero Vaz de Caminha (1500).","Literatura de catequese: textos jesuítas para converter indígenas, com destaque para José de Anchieta.","Visão eurocêntrica do indígena e deslumbramento com a natureza."]],
["Barroco","Século XVII, marcado pelo conflito entre fé e razão, céu e terra, espírito e carne.",["Cultismo: jogo de palavras, linguagem rebuscada. Conceptismo: jogo de ideias e raciocínio.","Figuras típicas: antítese e paradoxo.","Gregório de Matos, o Boca do Inferno: poesia satírica, lírica e religiosa.","Padre Antônio Vieira: sermões conceptistas, como o Sermão da Sexagésima."]],
["Arcadismo","Século XVIII, ligado ao Iluminismo e à Inconfidência Mineira.",["Bucolismo e pastoralismo: vida simples no campo, poetas se apresentam como pastores.","Lemas latinos: fugere urbem (fugir da cidade), carpe diem (aproveitar o dia), locus amoenus (lugar ameno).","Tomás Antônio Gonzaga (Marília de Dirceu), Cláudio Manuel da Costa e Basílio da Gama (O Uraguai)."]],
["Romantismo","Começa em 1836 com Suspiros Poéticos e Saudades, de Gonçalves de Magalhães. Valoriza sentimento, nacionalismo e idealização.",["1ª geração, indianista e nacionalista: Gonçalves Dias (Canção do Exílio).","2ª geração, ultrarromântica ou mal do século: pessimismo, morte, amor impossível (Álvares de Azevedo).","3ª geração, condoreira ou social: poesia abolicionista de Castro Alves (Navio Negreiro).","Prosa: José de Alencar com romances indianistas (Iracema, O Guarani), urbanos (Senhora) e regionalistas."]],
["Realismo e Naturalismo","A partir de 1881, reação ao Romantismo com visão crítica e objetiva da sociedade.",["Realismo: análise psicológica, ironia e crítica à burguesia. Machado de Assis inaugura com Memórias Póstumas de Brás Cubas (1881) e escreve Dom Casmurro.","Naturalismo: determinismo (meio, raça e momento moldam o indivíduo), zoomorfização e patologias.","Aluísio Azevedo: O Mulato (1881) e O Cortiço."]],
["Parnasianismo e Simbolismo","Movimentos poéticos do fim do século XIX, com propostas opostas.",["Parnasianismo: arte pela arte, rigor formal, soneto, vocabulário raro, objetividade. Olavo Bilac é o principal nome.","Simbolismo: musicalidade, sinestesia, espiritualidade, subjetividade e mistério.","Cruz e Sousa (Broquéis, 1893) e Alphonsus de Guimaraens."]],
["Pré-Modernismo","Início do século XX, transição com denúncia da realidade brasileira.",["Euclides da Cunha: Os Sertões, sobre a Guerra de Canudos.","Lima Barreto: Triste Fim de Policarpo Quaresma, crítica ao nacionalismo ufanista e ao racismo.","Monteiro Lobato: o personagem Jeca Tatu e a crítica ao atraso rural."]],
["Modernismo","Marco inicial na Semana de Arte Moderna de 1922, em São Paulo. Ruptura com a tradição e busca de uma arte brasileira.",["1ª fase (1922-1930), heroica: verso livre, humor, linguagem coloquial. Oswald de Andrade (Manifesto Antropófago) e Mário de Andrade (Macunaíma).","2ª fase (1930-1945): romance regionalista de 30 com Graciliano Ramos (Vidas Secas), Rachel de Queiroz (O Quinze) e Jorge Amado; poesia de Drummond, Cecília Meireles e Vinicius de Moraes.","3ª fase (1945 em diante): Clarice Lispector (fluxo de consciência), Guimarães Rosa (Grande Sertão: Veredas) e João Cabral de Melo Neto (Morte e Vida Severina)."]],
["Literatura contemporânea","O ENEM valoriza vozes antes silenciadas e temas sociais atuais.",["Conceição Evaristo e o conceito de escrevivência: escrita a partir da vivência de mulheres negras.","Carolina Maria de Jesus: Quarto de Despejo, diário da vida na favela do Canindé.","Literatura marginal e periférica, poesia de slam, literatura indígena (Ailton Krenak, Daniel Munduruku)."]]
],
s:[
["Das origens ao Arcadismo",45,["Fazer uma linha do tempo de Quinhentismo, Barroco e Arcadismo","Associar cada escola a duas características e um autor","Resolver 5 questões com trechos dessas escolas"]],
["Século XIX",50,["Comparar Romantismo e Realismo em uma tabela","Revisar as três gerações românticas","Resolver 6 questões de Romantismo, Realismo e Naturalismo"]],
["Poesia e transição",40,["Diferenciar Parnasianismo e Simbolismo com um exemplo de cada","Revisar as obras do Pré-Modernismo","Resolver 5 questões"]],
["Modernismo e contemporâneos",55,["Revisar as três fases modernistas","Ler um trecho de Conceição Evaristo ou Carolina Maria de Jesus","Resolver 8 questões e revisar os erros"]]
],
q:[
["Um poema apresenta pastores, vida simples no campo e o desejo de fugir da cidade. Essas características são típicas do:",["Barroco","Arcadismo","Romantismo","Parnasianismo","Modernismo"],1,"Bucolismo, pastoralismo e o lema fugere urbem são marcas centrais do Arcadismo, no século XVIII."],
["A obra que marca o início do Realismo no Brasil é:",["Iracema","O Cortiço","Memórias Póstumas de Brás Cubas","Macunaíma","Os Sertões"],2,"Memórias Póstumas de Brás Cubas, de Machado de Assis (1881), inaugura o Realismo. No mesmo ano, O Mulato inaugura o Naturalismo."],
["Gregório de Matos, conhecido como Boca do Inferno por sua poesia satírica, é o principal poeta do:",["Quinhentismo","Barroco","Arcadismo","Romantismo","Simbolismo"],1,"Gregório de Matos viveu no século XVII e é o grande nome da poesia barroca, com sátiras à sociedade baiana."],
["Um romance mostra personagens moldados pelo ambiente de um cortiço, descritos com características animais. Essa visão determinista é própria do:",["Romantismo","Naturalismo","Parnasianismo","Simbolismo","Arcadismo"],1,"Determinismo e zoomorfização são marcas do Naturalismo, como em O Cortiço, de Aluísio Azevedo."],
["A Semana de Arte Moderna, marco inicial do Modernismo brasileiro, ocorreu em:",["1888","1902","1922","1930","1945"],2,"A Semana aconteceu em fevereiro de 1922, no Theatro Municipal de São Paulo, no ano do centenário da Independência."],
["Castro Alves, autor de Navio Negreiro e conhecido como poeta dos escravos, pertence à geração:",["indianista do Romantismo","ultrarromântica do Romantismo","condoreira do Romantismo","parnasiana","simbolista"],2,"A terceira geração romântica, chamada condoreira, tem poesia social e abolicionista. Castro Alves é seu principal nome."],
["Vidas Secas, de Graciliano Ramos, que retrata uma família de retirantes no sertão, faz parte:",["do Pré-Modernismo","da 1ª fase modernista","do romance regionalista de 30","do Naturalismo","da geração de 45"],2,"Vidas Secas (1938) é um dos principais romances regionalistas da segunda fase modernista, a geração de 30, com crítica social."],
["O conceito de escrevivência, que une escrita e experiência de mulheres negras, foi criado pela autora:",["Clarice Lispector","Conceição Evaristo","Cecília Meireles","Rachel de Queiroz","Carolina Maria de Jesus"],1,"Conceição Evaristo cunhou o termo escrevivência. Carolina Maria de Jesus também é muito cobrada, mas por Quarto de Despejo."]
]},

{id:"artes",n:"Artes",g:"a",c:"#0F766E",
d:"Um guia prático para entender Artes sem complicação. Você revisa da Arte Pré-Histórica ao Modernismo, passando pelos estilos mais cobrados no ENEM, com explicações diretas para reconhecer características, interpretar obras e não travar nas questões.",
dica:"Nas questões de Artes a imagem ou descrição da obra é a pista. Procure elementos visuais: cores, formas, luz, perspectiva, material. Eles apontam o movimento mesmo que você não conheça a obra.",
t:[
["Arte Pré-Histórica","Primeiras manifestações artísticas, ligadas à sobrevivência, à magia e aos rituais.",["Paleolítico: pinturas rupestres de animais e caça (Lascaux, Altamira), estatuetas como a Vênus de Willendorf.","Neolítico: cerâmica, tecelagem e monumentos megalíticos como Stonehenge.","No Brasil: Parque Nacional da Serra da Capivara, no Piauí, com milhares de pinturas rupestres."]],
["Arte Antiga","Arte ligada à religião, ao poder e aos ideais de cada civilização.",["Egito: lei da frontalidade (tronco de frente, rosto e pernas de perfil), arte funerária e pirâmides.","Grécia: busca da proporção e da harmonia, corpo humano idealizado, ordens arquitetônicas dórica, jônica e coríntia.","Roma: engenharia com arcos, abóbadas e aquedutos; retratos realistas."]],
["Arte Medieval","Arte a serviço da Igreja, voltada à fé.",["Bizantina: mosaicos dourados e figuras chapadas.","Românica: igrejas com paredes grossas, poucas janelas, aspecto de fortaleza.","Gótica: verticalidade, arcos ogivais, vitrais coloridos e rosáceas, catedrais como a de Notre-Dame."]],
["Renascimento","Séculos XV e XVI, retomada dos valores greco-romanos com o ser humano no centro (antropocentrismo).",["Perspectiva linear, proporção e profundidade.","Sfumato: sombreado suave sem contornos, criado por Leonardo da Vinci (Mona Lisa).","Michelangelo (teto da Capela Sistina, Davi) e Rafael (Escola de Atenas)."]],
["Barroco","Séculos XVII e XVIII, arte dramática e emotiva, ligada à Contrarreforma.",["Contraste forte de luz e sombra (claro-escuro), movimento e diagonais.","Caravaggio e Bernini na Europa.","Barroco mineiro: Aleijadinho (profetas de Congonhas) e Mestre Ataíde (pintura de tetos de igrejas)."]],
["Do Neoclassicismo ao Pós-Impressionismo","Século XIX, com mudanças rápidas de estilo.",["Neoclassicismo: volta ao modelo clássico, equilíbrio e temas históricos (Jacques-Louis David).","Romantismo: emoção, natureza e cenas heroicas (Delacroix, A Liberdade Guiando o Povo).","Realismo: cotidiano de trabalhadores sem idealização (Courbet).","Impressionismo: luz natural, pinceladas soltas, pintura ao ar livre (Monet, Renoir).","Pós-Impressionismo: Van Gogh (cores intensas, pinceladas marcadas), Cézanne e Gauguin."]],
["Vanguardas europeias","Início do século XX, rompimento com a representação tradicional.",["Expressionismo: emoção e angústia com cores e formas distorcidas (Munch, O Grito).","Fauvismo: cor pura e intensa, sem compromisso com a realidade (Matisse).","Cubismo: decomposição em formas geométricas e vários pontos de vista ao mesmo tempo (Picasso, Braque).","Futurismo: velocidade, máquinas e movimento.","Dadaísmo: anti-arte, absurdo e ready-mades (Marcel Duchamp, A Fonte).","Surrealismo: sonho e inconsciente (Salvador Dalí, René Magritte)."]],
["Modernismo brasileiro e arte contemporânea","Busca de uma arte com identidade nacional e, depois, a arte que envolve o público.",["Anita Malfatti (exposição de 1917), Tarsila do Amaral (Abaporu, Movimento Antropofágico), Di Cavalcanti e Candido Portinari (Retirantes).","Arte contemporânea: performance, instalação, arte conceitual, grafite e intervenção urbana.","Hélio Oiticica (Parangolés) e Lygia Clark convidam o espectador a participar da obra.","Tropicália (anos 1960): mistura de cultura popular, erudita e estrangeira na música e nas artes."]]
],
s:[
["Das cavernas à Idade Média",45,["Revisar Pré-História, Antiguidade e Idade Média","Montar uma tabela: período, característica visual, exemplo","Resolver 4 questões"]],
["Renascimento e Barroco",45,["Comparar Renascimento (equilíbrio) e Barroco (drama)","Pesquisar imagens de Aleijadinho e de obras de Leonardo","Resolver 4 questões"]],
["Século XIX e vanguardas",50,["Fazer um cartão para cada vanguarda com uma palavra-chave","Observar uma obra de cada movimento e identificar a característica","Resolver 6 questões"]],
["Arte brasileira",45,["Revisar Modernismo brasileiro e Tropicália","Estudar arte contemporânea: performance, instalação, grafite","Refazer as questões erradas desta apostila"]]
],
q:[
["A técnica de sombreado suave, sem contornos definidos, usada por Leonardo da Vinci na Mona Lisa, chama-se:",["claro-escuro","sfumato","pontilhismo","afresco","perspectiva aérea"],1,"Sfumato vem do italiano esfumado: as transições entre luz e sombra são suaves, sem linhas de contorno."],
["Marcel Duchamp expôs um mictório com o título A Fonte, questionando o próprio conceito de arte. Essa obra está ligada ao:",["Cubismo","Dadaísmo","Impressionismo","Fauvismo","Futurismo"],1,"O ready-made, objeto do cotidiano apresentado como arte, é a marca do Dadaísmo, movimento de contestação e anti-arte."],
["A principal característica do Cubismo é:",["retratar o sonho e o inconsciente","usar cores puras e intensas sem relação com a realidade","representar o objeto por formas geométricas e vários pontos de vista ao mesmo tempo","exaltar a velocidade e as máquinas","captar a luz natural em pinceladas soltas"],2,"Picasso e Braque decompunham as figuras em formas geométricas e mostravam vários ângulos do mesmo objeto na tela."],
["As esculturas dos profetas em Congonhas, feitas por Aleijadinho, são exemplos do:",["Renascimento","Barroco mineiro","Neoclassicismo","Modernismo","Gótico"],1,"Aleijadinho é o maior nome do Barroco mineiro, no século XVIII, com obras em pedra-sabão e madeira."],
["Pintar ao ar livre para registrar os efeitos momentâneos da luz sobre a paisagem é característica do:",["Realismo","Expressionismo","Impressionismo","Surrealismo","Barroco"],2,"Os impressionistas, como Monet, pintavam ao ar livre com pinceladas rápidas para captar a luz de um instante."],
["O quadro Abaporu (1928), de Tarsila do Amaral, inspirou o movimento que propunha absorver a cultura estrangeira e transformá-la em algo brasileiro. Esse movimento é o:",["Tropicalismo","Pau-Brasil","Antropofágico","Concretismo","Verde-Amarelo"],2,"Abaporu inspirou o Manifesto Antropófago de Oswald de Andrade, que propunha devorar a cultura estrangeira e criar uma arte nacional."],
["Catedrais com grande verticalidade, arcos ogivais e vitrais coloridos pertencem ao estilo:",["românico","bizantino","gótico","barroco","neoclássico"],2,"O gótico buscava elevar o olhar ao céu com construções altas, arcos pontiagudos e vitrais que enchiam o interior de luz."],
["O Parque Nacional da Serra da Capivara, no Piauí, é importante para a história da arte por abrigar:",["esculturas barrocas","pinturas rupestres pré-históricas","azulejos coloniais","murais modernistas","arquitetura gótica"],1,"A Serra da Capivara concentra um dos maiores conjuntos de pinturas rupestres das Américas e é Patrimônio Mundial da UNESCO."]
]},

{id:"sociologia",n:"Sociologia",g:"a",c:"#2F855A",
d:"Um material direto para você compreender Sociologia sem ficar perdido em termos difíceis. Revise os autores clássicos, os conceitos sociais mais importantes e temas atuais que costumam aparecer no ENEM, como desigualdade, cidadania, mídia, consumo e direitos humanos.",
dica:"As questões de Sociologia costumam trazer um texto e pedir o conceito que o explica. Se aparecer coerção social, pense em Durkheim; classes e exploração, Marx; tipos de ação e dominação, Weber.",
t:[
["O surgimento da Sociologia","Nasce no século XIX para entender as mudanças trazidas pela Revolução Industrial e pela Revolução Francesa.",["Auguste Comte criou o termo sociologia e o positivismo: a sociedade estudada como as ciências naturais.","Urbanização acelerada, novas classes sociais e problemas sociais motivaram a nova ciência."]],
["Émile Durkheim","Estuda a sociedade como algo que existe fora dos indivíduos e os molda.",["Fato social: maneiras de agir e pensar que são exteriores, coercitivas e gerais.","Solidariedade mecânica (sociedades simples, semelhança) e orgânica (sociedades complexas, divisão do trabalho).","Anomia: enfraquecimento das normas sociais."]],
["Karl Marx","Analisa a sociedade a partir da economia e do conflito entre classes.",["Luta de classes: burguesia (donos dos meios de produção) contra proletariado (vende a força de trabalho).","Mais-valia: diferença entre o valor que o trabalhador produz e o salário que recebe.","Alienação: o trabalhador não se reconhece no que produz.","Ideologia: ideias da classe dominante que ocultam a exploração."]],
["Max Weber","Parte do indivíduo e do sentido que ele dá às suas ações.",["Ação social: racional com relação a fins, racional com relação a valores, afetiva e tradicional.","Dominação legítima: legal-racional (leis e burocracia), tradicional (costume) e carismática (qualidades do líder).","A Ética Protestante e o Espírito do Capitalismo; desencantamento do mundo."]],
["Cultura e identidade","Cultura é tudo o que é aprendido e compartilhado socialmente.",["Etnocentrismo: julgar outras culturas a partir da própria, como se fosse superior.","Relativismo cultural: compreender cada cultura em seus próprios termos.","Indústria cultural (Adorno e Horkheimer, Escola de Frankfurt): cultura produzida como mercadoria, padronizada para o consumo.","Pierre Bourdieu: capital cultural e violência simbólica."]],
["Desigualdade e estratificação","Formas de hierarquia entre grupos na sociedade.",["Castas (sem mobilidade), estamentos (sociedade feudal) e classes (mobilidade possível).","Racismo estrutural: desigualdade racial presente nas instituições e na organização social.","Desigualdade de gênero no mercado de trabalho e dupla jornada."]],
["Cidadania e direitos humanos","Cidadania é o conjunto de direitos e deveres. No Brasil, a Constituição de 1988 é chamada de Constituição Cidadã.",["T. H. Marshall: direitos civis (liberdade, séc. XVIII), políticos (voto, séc. XIX) e sociais (saúde, educação, séc. XX).","Declaração Universal dos Direitos Humanos (1948).","Movimentos sociais ampliam direitos: feminista, negro, LGBTQIA+, indígena, pela terra."]],
["Trabalho e sociedade contemporânea","As formas de organizar a produção mudaram a vida dos trabalhadores.",["Taylorismo: controle de tempos e movimentos. Fordismo: linha de montagem e produção em massa.","Toyotismo: produção flexível, just in time, trabalhador multifuncional.","Uberização e precarização: trabalho por aplicativo, sem direitos trabalhistas.","Zygmunt Bauman: modernidade líquida, relações frágeis e consumo. Fake news e bolhas nas redes sociais."]]
],
s:[
["Os clássicos",55,["Fazer um quadro Durkheim, Marx e Weber com três conceitos de cada","Explicar com suas palavras fato social, mais-valia e ação social","Resolver 6 questões sobre os clássicos"]],
["Cultura e desigualdade",45,["Revisar etnocentrismo, relativismo e indústria cultural","Relacionar racismo estrutural a uma notícia recente","Resolver 5 questões"]],
["Cidadania e trabalho",45,["Revisar os três tipos de direitos de Marshall","Comparar fordismo, toyotismo e uberização","Resolver 5 questões"]],
["Revisão integrada",40,["Refazer as questões erradas desta apostila","Usar um conceito sociológico como repertório em uma introdução de redação","Revisar o quadro dos clássicos de memória"]]
],
q:[
["Para Durkheim, os fatos sociais possuem três características principais. São elas:",["individualidade, liberdade e raridade","exterioridade, coercitividade e generalidade","racionalidade, afetividade e tradição","alienação, ideologia e mais-valia","mobilidade, conflito e consenso"],1,"Fatos sociais existem fora do indivíduo (exterioridade), impõem-se a ele (coercitividade) e são compartilhados pelo grupo (generalidade)."],
["No pensamento de Marx, a diferença entre o valor produzido pelo trabalhador e o salário que ele recebe chama-se:",["anomia","mais-valia","capital cultural","ação social","solidariedade orgânica"],1,"A mais-valia é o valor excedente apropriado pelo dono dos meios de produção e é a base da exploração capitalista para Marx."],
["Um líder político conquista seguidores por suas qualidades pessoais consideradas extraordinárias. Segundo Weber, trata-se de dominação:",["legal-racional","tradicional","carismática","burocrática","coercitiva"],2,"A dominação carismática se baseia na crença nas qualidades excepcionais do líder, não em leis nem em costumes."],
["Considerar os hábitos de outro povo estranhos e inferiores apenas por serem diferentes dos nossos é um exemplo de:",["relativismo cultural","etnocentrismo","aculturação","multiculturalismo","sincretismo"],1,"Etnocentrismo é tomar a própria cultura como padrão para julgar as demais. O relativismo cultural é a postura oposta."],
["Um modelo de produção flexível, com estoques mínimos (just in time) e trabalhador que executa várias funções, é chamado de:",["taylorismo","fordismo","toyotismo","feudalismo","mercantilismo"],2,"O toyotismo, surgido no Japão, substituiu a produção em massa do fordismo por produção sob demanda e trabalhadores multifuncionais."],
["O conceito de indústria cultural, que critica a transformação da cultura em mercadoria padronizada, foi formulado por:",["Durkheim e Comte","Adorno e Horkheimer","Marx e Engels","Weber e Simmel","Bauman e Giddens"],1,"Theodor Adorno e Max Horkheimer, da Escola de Frankfurt, criaram o conceito para criticar a cultura de massa."],
["A ideia de que vivemos em uma modernidade líquida, marcada por relações frágeis e passageiras, é do sociólogo:",["Pierre Bourdieu","Zygmunt Bauman","Auguste Comte","Karl Marx","Michel Foucault"],1,"Zygmunt Bauman usou a metáfora da liquidez para descrever a instabilidade das relações e das identidades no mundo atual."],
["O acesso à educação pública, à saúde e à previdência corresponde, segundo T. H. Marshall, aos direitos:",["civis","políticos","sociais","naturais","difusos"],2,"Direitos sociais garantem condições mínimas de bem-estar e se consolidaram no século XX. Civis são liberdades; políticos, participação e voto."]
]},

{id:"filosofia",n:"Filosofia",g:"a",c:"#166534",
d:"Um guia direto para entender Filosofia sem complicação. Você revisa os conceitos, autores e correntes filosóficas mais cobrados no ENEM, aprendendo a interpretar ideias sobre ética, sociedade, política, conhecimento e comportamento humano com mais segurança.",
dica:"O ENEM traz um trecho do filósofo e pede a ideia central. Leia devagar, sublinhe o conceito principal e ligue ao autor: Platão, mundo das ideias; Descartes, dúvida; Kant, dever; Sartre, liberdade.",
t:[
["Pré-socráticos","Primeiros filósofos gregos, buscavam a arché, o princípio de todas as coisas, pela razão e não pelo mito.",["Tales de Mileto: a água. Anaxímenes: o ar. Pitágoras: o número.","Heráclito: tudo muda (devir), ninguém se banha duas vezes no mesmo rio.","Parmênides: o ser é imutável, a mudança é ilusão dos sentidos.","Demócrito: tudo é formado por átomos."]],
["Sócrates e os sofistas","Mudança do foco da natureza para o ser humano e a ética.",["Sócrates: só sei que nada sei; conhece-te a ti mesmo.","Método socrático: ironia (mostrar a ignorância) e maiêutica (dar à luz as ideias por perguntas).","Sofistas: professores de retórica, defendiam o relativismo. Protágoras: o homem é a medida de todas as coisas."]],
["Platão e Aristóteles","Os dois pilares da filosofia ocidental.",["Platão: mundo das ideias (verdadeiro, eterno) e mundo sensível (cópia, mutável). Alegoria da caverna.","Platão, na República: governo dos filósofos.","Aristóteles: ato e potência, lógica, ética da virtude como justo meio entre excesso e falta.","Aristóteles: o ser humano é um animal político; o fim da vida é a felicidade (eudaimonia)."]],
["Filosofia medieval","Conciliação entre fé cristã e razão.",["Santo Agostinho: influência de Platão, livre-arbítrio, fé e razão se ajudam.","São Tomás de Aquino: influência de Aristóteles, cinco vias para provar a existência de Deus."]],
["Teoria do conhecimento moderna","Como conhecemos a verdade? Razão ou experiência?",["Racionalismo, Descartes: dúvida metódica e penso, logo existo. A razão é a fonte segura do conhecimento.","Empirismo, Locke e Hume: a mente nasce como tábula rasa e o conhecimento vem da experiência.","Kant: criticismo, une razão e experiência. O conhecimento depende das estruturas do sujeito."]],
["Filosofia política","Origem e justificativa do poder e do Estado.",["Maquiavel: separa ética e política; o príncipe precisa de virtù e fortuna.","Hobbes: no estado de natureza, guerra de todos contra todos; o homem é o lobo do homem; defende o Estado forte (Leviatã).","Locke: direitos naturais à vida, à liberdade e à propriedade; o governo pode ser destituído se violá-los.","Rousseau: o homem nasce bom e a sociedade o corrompe; vontade geral.","Montesquieu: separação dos três poderes."]],
["Ética","Como devemos agir?",["Kant: ética do dever. Imperativo categórico: aja de modo que sua ação possa virar lei universal.","Utilitarismo (Bentham e Stuart Mill): a ação certa é a que produz maior felicidade para o maior número.","Aristóteles: ética da virtude e do hábito."]],
["Filosofia contemporânea","Críticas à razão, à moral tradicional e ao poder.",["Nietzsche: crítica à moral cristã, vontade de potência, além-do-homem.","Sartre: existencialismo, a existência precede a essência; estamos condenados a ser livres.","Simone de Beauvoir: não se nasce mulher, torna-se.","Hannah Arendt: banalidade do mal, ao analisar o julgamento de Eichmann.","Michel Foucault: poder disciplinar e vigilância (Vigiar e Punir).","Escola de Frankfurt: razão instrumental e indústria cultural."]]
],
s:[
["Filosofia antiga",50,["Revisar pré-socráticos, Sócrates, Platão e Aristóteles","Explicar a alegoria da caverna com suas palavras","Resolver 5 questões"]],
["Conhecimento e fé",40,["Comparar racionalismo, empirismo e criticismo","Revisar Agostinho e Tomás de Aquino","Resolver 4 questões"]],
["Política e ética",50,["Fazer um quadro Hobbes, Locke e Rousseau sobre estado de natureza","Comparar a ética de Kant com o utilitarismo","Resolver 6 questões"]],
["Contemporâneos",45,["Associar uma frase-chave a cada filósofo contemporâneo","Usar Arendt ou Foucault como repertório de redação","Refazer as questões erradas"]]
],
q:[
["Na alegoria da caverna, prisioneiros veem apenas sombras até que um deles sai e contempla a realidade. Platão usa a imagem para representar:",["a passagem do conhecimento sensível para o conhecimento das ideias","a defesa do empirismo como única fonte de saber","a origem do Estado pelo contrato social","a superioridade da fé sobre a razão","a luta de classes na sociedade grega"],0,"As sombras simbolizam o mundo sensível e as opiniões; a saída da caverna representa a subida da alma ao mundo das ideias, o verdadeiro conhecimento."],
["A frase “Penso, logo existo” resume o pensamento de:",["Locke","Descartes","Hume","Aristóteles","Nietzsche"],1,"Descartes duvidou de tudo e concluiu que o próprio ato de pensar prova a existência. É o marco do racionalismo moderno."],
["Para Hobbes, no estado de natureza vive-se em guerra de todos contra todos. Por isso ele defende:",["a abolição do Estado","um Estado forte a quem os indivíduos cedem sua liberdade em troca de segurança","o direito de revolução contra o governo","o governo dos filósofos","a vontade geral como fonte do poder"],1,"Para sair do medo constante, os indivíduos fazem um contrato e transferem poder a um soberano forte, o Leviatã."],
["“Age apenas segundo uma máxima tal que possas querer que ela se torne lei universal.” Essa formulação é o:",["princípio da utilidade","imperativo categórico de Kant","justo meio de Aristóteles","cogito cartesiano","eterno retorno de Nietzsche"],1,"O imperativo categórico é o centro da ética do dever de Kant: a ação moral vale para todos, independentemente das consequências."],
["A ideia de que “a existência precede a essência”, ou seja, o ser humano primeiro existe e depois se define por suas escolhas, é de:",["Sartre","Platão","Tomás de Aquino","Hobbes","Comte"],0,"Jean-Paul Sartre, principal nome do existencialismo, afirma que não há natureza humana prévia: somos o que fazemos de nós."],
["“Ninguém se banha duas vezes no mesmo rio” expressa a ideia de que tudo está em constante mudança. Essa é a tese de:",["Parmênides","Heráclito","Tales","Demócrito","Pitágoras"],1,"Heráclito defendia o devir, a transformação permanente. Parmênides, ao contrário, dizia que o ser é imutável."],
["Ao analisar o julgamento de um oficial nazista que dizia apenas cumprir ordens, Hannah Arendt criou o conceito de:",["vontade de potência","banalidade do mal","razão instrumental","poder disciplinar","má-fé"],1,"A banalidade do mal mostra que grandes crimes podem ser cometidos por pessoas comuns que não refletem sobre o que fazem."],
["Para Aristóteles, a virtude ética consiste em:",["seguir o dever independentemente das consequências","buscar o prazer máximo","encontrar o justo meio entre o excesso e a falta","obedecer ao soberano","negar os desejos do corpo"],2,"A coragem, por exemplo, é o meio-termo entre a covardia (falta) e a temeridade (excesso). A virtude se forma pelo hábito."]
]},

{id:"historia",n:"História",g:"a",c:"#0E7A43",
d:"Um material direto para você estudar História sem se perder em datas e nomes difíceis. Revise os períodos, conflitos, revoluções e transformações sociais mais cobradas no ENEM, entendendo como esses acontecimentos impactaram o Brasil e o mundo.",
dica:"O ENEM cobra processos, não datas soltas. Pergunte sempre: qual era o contexto, quem estava envolvido e quais foram as consequências. História do Brasil é a parte mais cobrada.",
t:[
["Antiguidade clássica","Grécia e Roma formaram a base política e cultural do Ocidente.",["Democracia ateniense: direta, mas excluía mulheres, escravizados e estrangeiros (metecos).","Esparta: sociedade militarizada.","Roma: Monarquia, República (Senado, conflitos entre patrícios e plebeus) e Império (política do pão e circo)."]],
["Idade Média","Do século V ao XV na Europa.",["Feudalismo: economia agrária, relação entre senhor e servo, poder descentralizado.","Igreja Católica com grande poder político e cultural.","Cruzadas e renascimento comercial e urbano na Baixa Idade Média; peste negra no século XIV."]],
["Idade Moderna","Formação dos Estados nacionais e expansão europeia.",["Absolutismo: poder concentrado no rei. Mercantilismo: metalismo, balança comercial favorável, colônias.","Grandes Navegações e colonização da América.","Reforma Protestante, iniciada por Lutero em 1517, e Contrarreforma católica.","Iluminismo: razão, liberdade e crítica ao absolutismo (Voltaire, Montesquieu, Rousseau)."]],
["Revoluções liberais e Industrial","Séculos XVII a XIX, fim do Antigo Regime.",["Revolução Gloriosa (1688): monarquia parlamentar na Inglaterra.","Independência dos EUA (1776).","Revolução Francesa (1789): liberdade, igualdade e fraternidade; fim dos privilégios da nobreza.","Revolução Industrial: máquinas a vapor, urbanização, proletariado e movimentos operários."]],
["Brasil Colônia","De 1500 a 1822.",["Ciclos: pau-brasil, açúcar no Nordeste (século XVI-XVII) e mineração em Minas Gerais (século XVIII).","Escravização de africanos e indígenas; resistência nos quilombos, como Palmares, liderado por Zumbi.","Revoltas: Inconfidência Mineira (1789) e Conjuração Baiana (1798), com participação popular."]],
["Brasil Império","De 1822 a 1889.",["Independência em 1822; Primeiro Reinado com a Constituição de 1824 e o Poder Moderador.","Período Regencial com revoltas: Cabanagem, Farroupilha (RS, 1835-1845), Balaiada, Sabinada e Malês.","Segundo Reinado: café, Guerra do Paraguai (1864-1870) e imigração europeia.","Abolição gradual: Eusébio de Queirós (1850), Ventre Livre (1871), Sexagenários (1885) e Lei Áurea (1888)."]],
["Brasil República","De 1889 até hoje.",["Primeira República: política do café com leite, coronelismo, voto de cabresto; Canudos e Revolta da Vacina.","Era Vargas (1930-1945): CLT (1943), direitos trabalhistas, Estado Novo ditatorial a partir de 1937.","Período democrático: JK, Plano de Metas e construção de Brasília.","Ditadura Militar (1964-1985): AI-5, censura, repressão e milagre econômico; Diretas Já.","Redemocratização: Constituição de 1988."]],
["Século XX no mundo","Guerras mundiais, totalitarismos e a Guerra Fria.",["Primeira Guerra (1914-1918) e Revolução Russa (1917).","Crise de 1929 e ascensão do nazismo e do fascismo.","Segunda Guerra (1939-1945) e Holocausto.","Guerra Fria: EUA capitalista contra URSS socialista, corrida armamentista e espacial, sem confronto direto.","Descolonização da África e da Ásia."]]
],
s:[
["Mundo antigo e medieval",45,["Revisar Grécia, Roma e feudalismo","Comparar a democracia ateniense com a atual","Resolver 4 questões"]],
["Idade Moderna e revoluções",50,["Revisar absolutismo, Iluminismo e Revolução Francesa","Relacionar a Revolução Industrial ao surgimento da classe operária","Resolver 5 questões"]],
["Brasil Colônia e Império",60,["Fazer uma linha do tempo de 1500 a 1889","Revisar as leis abolicionistas em ordem","Resolver 6 questões"]],
["Brasil República e século XX",60,["Revisar Era Vargas e Ditadura Militar","Estudar Guerra Fria e as guerras mundiais","Resolver 6 questões e refazer as erradas"]]
],
q:[
["A democracia de Atenas, na Grécia Antiga, é considerada limitada porque:",["era representativa, com deputados eleitos","excluía mulheres, escravizados e estrangeiros da participação política","era controlada pela Igreja","permitia o voto apenas aos militares","não tinha assembleias"],1,"A democracia ateniense era direta, mas só cidadãos (homens adultos, filhos de atenienses) participavam, o que excluía grande parte da população."],
["A lei que aboliu a escravidão no Brasil, em 1888, foi a:",["Lei Eusébio de Queirós","Lei do Ventre Livre","Lei dos Sexagenários","Lei Áurea","Lei de Terras"],3,"A Lei Áurea, assinada pela princesa Isabel em 13 de maio de 1888, encerrou a escravidão legal, sem política de integração para os libertos."],
["O Ato Institucional nº 5 (AI-5), de 1968, durante a Ditadura Militar, representou:",["o fim da censura","o endurecimento do regime, com fechamento do Congresso e suspensão de garantias","a volta das eleições diretas","a anistia aos presos políticos","a criação da Constituição de 1988"],1,"O AI-5 permitiu fechar o Congresso, cassar mandatos e suspender o habeas corpus para crimes políticos. Foi o período mais repressivo do regime."],
["A Revolução Farroupilha (1835-1845), no Rio Grande do Sul, teve entre suas causas:",["a abolição da escravidão","a insatisfação dos estancieiros com os impostos sobre o charque","a chegada da família real","a Guerra do Paraguai","a crise do café"],1,"Os estancieiros gaúchos reclamavam da taxação do charque, que perdia competitividade para o produto platino. Foi a revolta regencial mais longa."],
["A Consolidação das Leis do Trabalho (CLT) foi criada em 1943, no governo de:",["Juscelino Kubitschek","Getúlio Vargas","Dom Pedro II","Castelo Branco","Washington Luís"],1,"A CLT reuniu direitos como salário mínimo, férias e carteira de trabalho, durante o Estado Novo de Getúlio Vargas."],
["A Reforma Protestante teve início em 1517 com a publicação das 95 teses de:",["João Calvino","Martinho Lutero","Henrique VIII","Voltaire","Inácio de Loyola"],1,"Lutero criticou a venda de indulgências e questionou a autoridade do papa, dividindo o cristianismo ocidental."],
["O coronelismo e o voto de cabresto são marcas políticas de qual período?",["Brasil Colônia","Primeiro Reinado","Primeira República","Era Vargas","Nova República"],2,"Na Primeira República (1889-1930), o voto era aberto e os coronéis controlavam os votos de sua região, sustentando a política do café com leite."],
["A Guerra Fria (1947-1991) caracterizou-se por:",["uma guerra direta entre EUA e URSS em território europeu","a disputa ideológica, militar e tecnológica entre EUA e URSS sem confronto direto entre eles","a união de EUA e URSS contra o nazismo","a expansão do feudalismo","o fim das armas nucleares"],1,"As superpotências disputaram influência, armas e a corrida espacial, e os conflitos armados ocorreram em outros países, como Coreia e Vietnã."]
]},

{id:"geografia",n:"Geografia",g:"a",c:"#15803D",
d:"Um guia direto para você estudar Geografia sem complicação. Entenda os principais temas cobrados no ENEM, como meio ambiente, população, economia, urbanização, agricultura, energia e espaço geográfico, com resumos claros para facilitar sua revisão.",
dica:"Questões ambientais e urbanas são as mais cobradas. Quando aparecer mapa ou gráfico, leia título, legenda e escala antes do enunciado.",
t:[
["Cartografia","Leitura e interpretação de mapas.",["Latitude: distância em graus em relação à Linha do Equador (norte ou sul). Longitude: em relação ao Meridiano de Greenwich (leste ou oeste).","Fusos horários: a Terra gira 360° em 24 h, então 15° equivalem a 1 hora. A leste as horas estão adiantadas.","Projeção de Mercator conserva formas e distorce áreas perto dos polos; a de Peters conserva áreas e distorce formas."],["15° de longitude = 1 hora","Leste adianta, oeste atrasa"]],
["Geologia e relevo","Forças que formam e transformam o relevo.",["Agentes internos: tectonismo, vulcanismo e terremotos. Agentes externos: chuva, vento, rios e seres vivos.","Intemperismo desgasta a rocha; erosão transporta o material.","O Brasil está no centro da placa Sul-Americana, por isso tem poucos terremotos fortes. Relevo com planaltos, planícies e depressões."]],
["Clima e biomas brasileiros","Fatores climáticos e a vegetação do Brasil.",["Fatores: latitude, altitude, maritimidade, continentalidade e massas de ar.","Amazônia: floresta equatorial, maior biodiversidade. Cerrado: savana, berço das águas, pressionado pelo agronegócio.","Caatinga: único bioma exclusivamente brasileiro, clima semiárido, plantas xerófilas.","Mata Atlântica: o mais devastado. Pantanal: maior planície alagável. Pampa: campos do sul."]],
["Questões ambientais","O tema mais recorrente de Geografia no ENEM.",["Efeito estufa é natural; o aquecimento global é sua intensificação pela emissão de CO₂ e metano.","Ilhas de calor: temperatura mais alta em áreas urbanas pelo asfalto, concreto e pouca vegetação.","Inversão térmica: ar frio fica preso sob camada de ar quente, retendo poluentes, comum no inverno.","Chuva ácida: óxidos de enxofre e nitrogênio. Acordos: Protocolo de Kyoto e Acordo de Paris; a COP30 ocorreu em Belém, em 2025."]],
["População","Dinâmica demográfica e indicadores sociais.",["Transição demográfica: queda da mortalidade e depois da natalidade, levando ao envelhecimento da população.","Bônus demográfico: maior proporção de pessoas em idade de trabalhar.","IDH combina renda, educação e longevidade.","Migrações internas (êxodo rural, Nordeste para Sudeste) e internacionais (refugiados)."]],
["Urbanização","Crescimento das cidades e seus problemas.",["Brasil: urbanização rápida e desordenada a partir de 1950, com favelização e periferização.","Conurbação: encontro das malhas urbanas de cidades vizinhas. Metrópole e região metropolitana.","Segregação socioespacial, mobilidade urbana, gentrificação."]],
["Agropecuária e energia","Uso da terra e fontes de energia.",["Agronegócio exportador de commodities (soja, milho, carne) e concentração fundiária.","Modernização conservadora: máquinas no campo sem reforma agrária, gerando êxodo rural.","Matriz elétrica brasileira predominantemente renovável, com destaque para hidrelétricas e crescimento de eólica e solar.","Petróleo e pré-sal; impactos das grandes usinas hidrelétricas sobre comunidades e ambientes."]],
["Globalização e geopolítica","Integração econômica mundial e conflitos.",["Multinacionais, fluxos de informação e capital; Divisão Internacional do Trabalho.","Blocos econômicos: Mercosul, União Europeia, USMCA; grupo dos BRICS.","Conflitos territoriais, refugiados e disputas por recursos naturais."]]
],
s:[
["Cartografia",40,["Revisar coordenadas e fusos horários","Resolver 5 cálculos de fuso","Comparar as projeções de Mercator e Peters"]],
["Natureza e ambiente",55,["Revisar biomas e fatores climáticos","Fazer um quadro dos problemas ambientais urbanos","Resolver 6 questões ambientais"]],
["Sociedade e espaço",50,["Revisar população e urbanização","Explicar conurbação, gentrificação e segregação com exemplos","Resolver 5 questões"]],
["Economia e mundo",45,["Revisar agronegócio, energia e globalização","Ler uma notícia sobre clima ou energia e relacionar aos conteúdos","Refazer as questões erradas"]]
],
q:[
["Uma cidade está 45° a leste de outra. Considerando apenas os fusos teóricos, a cidade a leste está:",["3 horas atrasada","3 horas adiantada","45 minutos adiantada","1 hora adiantada","4,5 horas atrasada"],1,"Cada 15° de longitude equivale a 1 hora. 45 ÷ 15 = 3. Como o sol nasce primeiro a leste, as horas lá estão adiantadas."],
["O único bioma exclusivamente brasileiro, de clima semiárido e vegetação adaptada à seca, é a:",["Amazônia","Mata Atlântica","Caatinga","Pampa","Pantanal"],2,"A Caatinga só existe no Brasil, principalmente no Nordeste, com plantas xerófilas que suportam longos períodos sem chuva."],
["No inverno, uma camada de ar frio fica presa próximo ao solo sob uma camada de ar quente, concentrando poluentes nas grandes cidades. Esse fenômeno é a:",["ilha de calor","chuva ácida","inversão térmica","efeito estufa","El Niño"],2,"Na inversão térmica o ar frio, mais denso, não sobe e retém a poluição perto do solo, piorando problemas respiratórios."],
["As temperaturas mais altas no centro das grandes cidades do que nas áreas rurais próximas caracterizam:",["inversão térmica","ilha de calor","continentalidade","efeito orográfico","maritimidade"],1,"Asfalto e concreto absorvem calor, há pouca vegetação e muitas fontes de calor, como veículos. Isso forma a ilha de calor."],
["Quando as áreas urbanas de dois ou mais municípios vizinhos crescem até se unirem fisicamente, ocorre a:",["gentrificação","conurbação","metropolização","segregação","periferização"],1,"Na conurbação, o limite entre as cidades deixa de ser visível na paisagem, como em várias regiões metropolitanas brasileiras."],
["A queda da taxa de natalidade e o aumento da expectativa de vida no Brasil levam a:",["crescimento acelerado da população jovem","envelhecimento da população","aumento da mortalidade infantil","fim das migrações internas","explosão demográfica"],1,"Com menos nascimentos e vidas mais longas, a pirâmide etária se estreita na base e se alarga no topo. É a transição demográfica."],
["A principal fonte de geração de energia elétrica no Brasil é a:",["termelétrica a carvão","nuclear","hidrelétrica","solar","geotérmica"],2,"A matriz elétrica brasileira é majoritariamente renovável e baseada em hidrelétricas, embora eólica e solar cresçam rápido."],
["Em um mapa-múndi na projeção de Mercator, a Groenlândia parece quase do tamanho da África. Isso ocorre porque essa projeção:",["conserva as áreas e distorce as formas","conserva as formas e distorce as áreas em altas latitudes","não usa coordenadas geográficas","foi feita para mostrar a Europa menor","é equivalente"],1,"Mercator é conforme: mantém as formas, útil para navegação, mas amplia muito as áreas perto dos polos."]
]},

{id:"quimica",n:"Química",g:"a",c:"#1B8A4B",fl:"Fórmulas essenciais",
d:"Um guia direto para entender Química sem travar nas fórmulas e conceitos. Você revisa os assuntos mais cobrados no ENEM, aprende a identificar o que a questão está pedindo e ganha mais segurança para resolver exercícios de química orgânica, inorgânica, equilíbrio, soluções e energia.",
dica:"A Química do ENEM é contextualizada: tratamento de água, combustíveis, alimentos e poluição. Identifique qual conteúdo está por trás do contexto e só então escolha a fórmula.",
t:[
["Atomística e tabela periódica","Estrutura do átomo e organização dos elementos.",["Número atômico (Z) = prótons. Número de massa (A) = prótons + nêutrons.","Isótopos: mesmo número de prótons. Íons: átomos que ganharam (ânions) ou perderam (cátions) elétrons.","Famílias: metais alcalinos (1), halogênios (17), gases nobres (18). Eletronegatividade cresce para cima e para a direita."],["A = Z + N"]],
["Ligações e forças intermoleculares","Como os átomos se unem e as moléculas interagem.",["Iônica: metal com ametal, transferência de elétrons (NaCl).","Covalente: entre ametais, compartilhamento de elétrons (H₂O, CO₂).","Metálica: mar de elétrons, conduz eletricidade.","Ligação de hidrogênio: explica o alto ponto de ebulição da água. Semelhante dissolve semelhante (polar dissolve polar)."]],
["Funções inorgânicas e pH","Ácidos, bases, sais e óxidos no cotidiano.",["Ácido libera H⁺ em água; base libera OH⁻.","pH menor que 7: ácido; igual a 7: neutro; maior que 7: básico.","Neutralização: ácido + base forma sal + água (antiácido no estômago, calcário no solo).","Óxidos ácidos (SO₂, NO₂) causam chuva ácida."],["ácido + base → sal + água","pH < 7 ácido | pH = 7 neutro | pH > 7 básico"]],
["Estequiometria","Cálculo das quantidades em uma reação.",["Primeiro balanceie a equação; os coeficientes dão a proporção em mol.","1 mol contém 6 × 10²³ partículas; massa molar em g/mol.","Monte regra de três entre o que o problema dá e o que pede."],["n = m / M","1 mol = 6 × 10²³ partículas"]],
["Soluções","Concentração e diluição.",["Concentração comum: massa de soluto por volume de solução.","Molaridade: mols de soluto por litro de solução.","Na diluição a quantidade de soluto não muda; só o volume aumenta."],["C = m / V","M = n / V","C₁·V₁ = C₂·V₂"]],
["Termoquímica e cinética","Energia e velocidade das reações.",["Exotérmica libera calor (ΔH < 0), como a combustão. Endotérmica absorve calor (ΔH > 0).","Aumentam a velocidade: temperatura, concentração, superfície de contato e catalisador.","Catalisador diminui a energia de ativação e não é consumido."],["ΔH = H_produtos − H_reagentes"]],
["Equilíbrio químico e eletroquímica","Reações reversíveis e produção de energia elétrica.",["Princípio de Le Chatelier: o equilíbrio se desloca para reduzir a perturbação (concentração, pressão, temperatura).","Pilha: reação espontânea. No ânodo ocorre oxidação (perde elétrons); no cátodo, redução (ganha elétrons).","Eletrólise: reação não espontânea provocada por corrente elétrica.","Corrosão e metal de sacrifício protegem estruturas de ferro."]],
["Química orgânica","Compostos de carbono: combustíveis, alimentos, remédios e plásticos.",["Funções: álcool (–OH), ácido carboxílico (–COOH), éster (aroma de frutas), aldeído, cetona, amina, éter.","Isomeria: mesma fórmula molecular, estruturas diferentes.","Polímeros: plásticos, borracha, e o problema do descarte.","Combustíveis: gasolina, etanol (renovável), biodiesel."]]
],
s:[
["Átomo e ligações",45,["Revisar atomística, tabela e ligações","Resolver 5 questões de ligação e polaridade","Explicar por que o sal dissolve na água e o óleo não"]],
["Inorgânica e cálculos",60,["Revisar pH, neutralização e estequiometria","Resolver 6 questões de cálculo (mol, concentração, diluição)","Anotar as fórmulas de memória"]],
["Físico-química",55,["Revisar termoquímica, cinética, equilíbrio e pilhas","Resolver 6 questões","Revisar ânodo e cátodo com um esquema"]],
["Orgânica e ambiental",50,["Fazer cartões com cada função orgânica","Revisar chuva ácida, efeito estufa e tratamento de água","Refazer as questões erradas"]]
],
q:[
["Um átomo de cloro possui 17 prótons e 18 nêutrons. Seu número de massa é:",["17","18","34","35","1"],3,"A = Z + N = 17 + 18 = 35. O número de massa soma prótons e nêutrons, pois os elétrons têm massa desprezível."],
["Um refrigerante tem pH igual a 3. Esse líquido é classificado como:",["básico","neutro","ácido","alcalino","salino"],2,"Valores de pH abaixo de 7 indicam solução ácida. Refrigerantes são ácidos por causa do ácido fosfórico e do gás carbônico dissolvido."],
["Um comprimido efervescente se dissolve mais rápido quando triturado. O fator que aumentou a velocidade da reação foi:",["a temperatura","a superfície de contato","o catalisador","a pressão","a concentração do produto"],1,"Triturar aumenta a área exposta ao contato com a água, o que aumenta as colisões entre as partículas e acelera a reação."],
["100 mL de uma solução de concentração 2 mol/L são diluídos com água até o volume de 400 mL. A nova concentração é:",["0,5 mol/L","1 mol/L","4 mol/L","8 mol/L","0,2 mol/L"],0,"C₁·V₁ = C₂·V₂: 2 × 100 = C₂ × 400, logo C₂ = 0,5 mol/L. O volume quadruplicou, então a concentração caiu para um quarto."],
["O etanol, usado como combustível, apresenta o grupo –OH ligado a carbono saturado. Ele pertence à função:",["ácido carboxílico","éster","álcool","cetona","amina"],2,"O grupo hidroxila (–OH) ligado a carbono saturado caracteriza os álcoois. Etanol: CH₃–CH₂–OH."],
["A queima da gasolina em um motor libera energia na forma de calor. Essa reação é:",["endotérmica, com ΔH > 0","exotérmica, com ΔH < 0","endotérmica, com ΔH < 0","exotérmica, com ΔH > 0","sem variação de energia"],1,"Toda combustão libera energia, então é exotérmica. Como os produtos ficam com menos energia que os reagentes, ΔH é negativo."],
["Em uma pilha, o eletrodo em que ocorre a oxidação é chamado de:",["cátodo, polo positivo","ânodo, polo negativo","ponte salina","eletrólito","cátodo, polo negativo"],1,"No ânodo o metal perde elétrons (oxidação) e é o polo negativo da pilha. Os elétrons seguem pelo fio até o cátodo, onde há redução."],
["A chuva ácida, que corrói monumentos e prejudica lagos, é causada principalmente pela emissão de:",["gás oxigênio e nitrogênio","óxidos de enxofre e de nitrogênio","gás hélio","vapor de água","gás ozônio na estratosfera"],1,"SO₂ e NOx, liberados por combustíveis fósseis e indústrias, reagem com a água da atmosfera formando ácidos sulfúrico e nítrico."]
]},

{id:"fisica",n:"Física",g:"a",c:"#0F766E",fl:"Fórmulas essenciais",
d:"Um material direto para estudar Física sem se perder em fórmulas complicadas. Você revisa os principais assuntos cobrados no ENEM, como cinemática, dinâmica, termodinâmica, ondas, eletricidade e gravitação, com resumos claros para facilitar a compreensão e a prática.",
dica:"Eletricidade e energia são os assuntos mais cobrados de Física. Confira sempre as unidades antes de calcular: km/h para m/s, minutos para horas, W para kW.",
t:[
["Cinemática","Estuda o movimento sem considerar as causas.",["Velocidade média é o deslocamento dividido pelo tempo.","MRU: velocidade constante. MUV: aceleração constante.","Para converter km/h em m/s, divida por 3,6."],["v = Δs / Δt","s = s₀ + v·t","v = v₀ + a·t","s = s₀ + v₀·t + a·t²/2","v² = v₀² + 2·a·Δs"]],
["Dinâmica e Leis de Newton","Estuda as forças que causam o movimento.",["1ª lei (inércia): um corpo mantém seu estado se a força resultante for nula. Explica o cinto de segurança.","2ª lei: a força resultante é massa vezes aceleração.","3ª lei (ação e reação): forças em pares, em corpos diferentes.","Atrito se opõe ao deslizamento; peso é a força da gravidade."],["F = m·a","P = m·g","Fat = μ·N"]],
["Trabalho, energia e potência","Transformações e conservação de energia.",["Energia cinética depende da velocidade; potencial gravitacional, da altura.","Sem atrito, a energia mecânica se conserva.","Potência é a energia transformada por unidade de tempo."],["Ec = m·v²/2","Ep = m·g·h","τ = F·d","P = E / Δt"]],
["Hidrostática","Pressão e empuxo em fluidos.",["Pressão aumenta com a profundidade (Stevin).","Princípio de Pascal: a pressão se transmite integralmente (elevador hidráulico).","Princípio de Arquimedes: todo corpo imerso recebe empuxo igual ao peso do líquido deslocado."],["p = F / A","p = p₀ + d·g·h","E = d·V·g"]],
["Termologia","Calor, temperatura e suas trocas.",["Calor sensível muda a temperatura; calor latente muda o estado físico.","Propagação: condução (sólidos), convecção (fluidos, correntes) e irradiação (ondas, sem meio).","Dilatação: materiais aumentam de tamanho quando aquecidos."],["Q = m·c·ΔT","Q = m·L","Água: c = 1 cal/g°C"]],
["Ondulatória e óptica","Som, luz e seus fenômenos.",["Som é onda mecânica (precisa de meio); luz é onda eletromagnética (propaga no vácuo).","Reflexão, refração (mudança de meio e de velocidade), difração e interferência.","Espelhos e lentes; miopia se corrige com lente divergente e hipermetropia com convergente."],["v = λ·f","f = 1 / T"]],
["Eletricidade","O tema mais cobrado de Física no ENEM.",["Resistência: dificuldade à passagem de corrente.","Em série a corrente é a mesma; em paralelo a tensão é a mesma. As tomadas e lâmpadas das casas ficam em paralelo.","Consumo de energia elétrica em kWh: potência em kW vezes tempo em horas."],["U = R·i","P = U·i","E = P·Δt (kWh)"]],
["Gravitação e eletromagnetismo","Forças à distância.",["Leis de Kepler: órbitas elípticas, áreas iguais em tempos iguais.","Lei da gravitação universal: a força diminui com o quadrado da distância.","Indução eletromagnética: campo magnético variável gera corrente. É o princípio dos geradores das usinas."],["F = G·M·m / d²"]]
],
s:[
["Movimento e forças",55,["Revisar cinemática e as três Leis de Newton","Resolver 6 questões com conversão de unidades","Explicar uma situação do cotidiano com cada lei de Newton"]],
["Energia",45,["Revisar energia, trabalho, potência e hidrostática","Resolver 5 questões de conservação de energia","Escrever as fórmulas de memória"]],
["Calor e ondas",50,["Revisar calor sensível, latente e propagação","Revisar ondas, som, luz e lentes","Resolver 6 questões"]],
["Eletricidade",60,["Revisar lei de Ohm, potência e consumo","Calcular o consumo mensal de 3 aparelhos da sua casa","Resolver 6 questões e refazer as erradas"]]
],
q:[
["Um carro trafega a 72 km/h. Sua velocidade em metros por segundo é:",["7,2 m/s","20 m/s","36 m/s","259,2 m/s","72 m/s"],1,"Para passar de km/h para m/s, divida por 3,6: 72 ÷ 3,6 = 20 m/s."],
["Uma força resultante acelera um objeto de 10 kg a 2 m/s². A intensidade dessa força é:",["5 N","12 N","20 N","8 N","0,2 N"],2,"Pela 2ª Lei de Newton, F = m·a = 10 × 2 = 20 N."],
["Um chuveiro de 5.000 W é usado 30 minutos por dia durante 30 dias. O consumo mensal é:",["75 kWh","150 kWh","2.500 kWh","7,5 kWh","750 kWh"],0,"E = P·Δt = 5 kW × 0,5 h × 30 dias = 75 kWh. Sempre converta W para kW e minutos para horas."],
["Um objeto de 2 kg está a 5 m de altura. Com g = 10 m/s², sua energia potencial gravitacional é:",["10 J","50 J","100 J","25 J","1.000 J"],2,"Ep = m·g·h = 2 × 10 × 5 = 100 J."],
["Uma onda tem frequência de 10 Hz e comprimento de onda de 2 m. Sua velocidade de propagação é:",["5 m/s","12 m/s","20 m/s","0,2 m/s","8 m/s"],2,"v = λ·f = 2 × 10 = 20 m/s."],
["Para aquecer 200 g de água de 20 °C até 70 °C (c = 1 cal/g°C), a quantidade de calor necessária é:",["1.000 cal","4.000 cal","10.000 cal","14.000 cal","250 cal"],2,"Q = m·c·ΔT = 200 × 1 × 50 = 10.000 cal."],
["As lâmpadas de uma casa são ligadas em paralelo porque, dessa forma:",["a corrente é a mesma em todas","se uma queimar, as outras continuam funcionando","a resistência total aumenta","gastam menos energia","a tensão é dividida entre elas"],1,"Em paralelo cada lâmpada recebe a tensão total da rede e tem seu próprio caminho. Se uma queima, as outras não se apagam."],
["Em uma freada brusca, o passageiro sem cinto é lançado para a frente. Isso é explicado pela:",["Lei da Inércia","Lei da Ação e Reação","Lei de Ohm","Lei de Hooke","Lei da Gravitação"],0,"Pela 1ª Lei de Newton, o corpo tende a manter a velocidade que tinha. O carro para, mas o passageiro continua em movimento até ser contido."]
]},

{id:"biologia",n:"Biologia",g:"a",c:"#2F855A",
d:"Revise Biologia para o ENEM com resumos simples, organizados e focados nos temas mais importantes da prova. O material aborda células, genética, evolução, ecologia, corpo humano, bioquímica, fisiologia e processos naturais para ajudar você a entender melhor as questões.",
dica:"Ecologia é o assunto mais cobrado de Biologia no ENEM, seguido de fisiologia humana e genética. Desconfie de alternativas lamarquistas, que dizem que o organismo muda porque precisa.",
t:[
["Citologia","A célula é a unidade básica da vida.",["Procariontes (bactérias) não têm núcleo organizado; eucariontes têm núcleo e organelas.","Mitocôndria: respiração celular. Cloroplasto: fotossíntese. Ribossomo: síntese de proteínas.","Complexo golgiense: secreção. Lisossomo: digestão celular.","Transporte: difusão e osmose (sem gasto de energia) e transporte ativo (com gasto de ATP)."]],
["Bioquímica e metabolismo","Moléculas da vida e obtenção de energia.",["Carboidratos: energia. Lipídios: reserva e membranas. Proteínas: estrutura e enzimas.","Fotossíntese: gás carbônico + água + luz formam glicose e oxigênio.","Respiração celular: glicose + oxigênio liberam energia, gás carbônico e água.","Fermentação: sem oxigênio, produz álcool (pão, cerveja) ou ácido lático (músculo)."],["6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ (fotossíntese)","C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energia (respiração)"]],
["Genética e biotecnologia","Hereditariedade e manipulação do DNA.",["DNA → RNA → proteína. Gene é um trecho de DNA.","1ª Lei de Mendel: cada característica é determinada por um par de alelos que se separam nos gametas.","Aa × Aa gera 1 AA : 2 Aa : 1 aa, ou 3 dominantes para 1 recessivo.","Grupos sanguíneos ABO e fator Rh; transgênicos, clonagem, CRISPR, teste de DNA."],["Aa × Aa → 3:1","P(aa) = 1/4"]],
["Evolução","Como as espécies mudam ao longo do tempo.",["Lamarck: uso e desuso e herança de caracteres adquiridos (ideia refutada).","Darwin: seleção natural. Indivíduos com características vantajosas sobrevivem e se reproduzem mais.","Teoria sintética: mutação e recombinação geram variabilidade, e a seleção natural atua sobre ela.","Exemplo clássico: bactérias resistentes a antibióticos são selecionadas pelo uso inadequado do remédio."]],
["Ecologia","O tema mais cobrado de Biologia no ENEM.",["Cadeia alimentar: produtores, consumidores e decompositores. A energia flui em um só sentido e diminui a cada nível.","Magnificação trófica: substâncias não degradáveis (mercúrio, pesticidas) se acumulam mais nos níveis mais altos.","Relações: mutualismo (líquen), comensalismo, parasitismo, predação, competição.","Ciclos do carbono e do nitrogênio; sucessão ecológica; espécies invasoras."]],
["Fisiologia humana","Funcionamento do corpo.",["Digestão: começa na boca, proteínas no estômago, absorção no intestino delgado.","Circulação: coração com 4 cavidades, circulação dupla e completa.","Imunidade: vacina gera imunização ativa (produz anticorpos e memória); soro é imunização passiva (anticorpos prontos).","Hormônios: insulina reduz a glicose no sangue; sua falta causa diabetes."]],
["Doenças e saúde pública","Parasitoses e doenças infecciosas.",["Vírus: dengue, zika, chikungunya (mosquito Aedes aegypti), covid-19, sarampo, HIV.","Bactérias: tuberculose, leptospirose (urina de rato), cólera.","Protozoários: doença de Chagas (barbeiro), malária (mosquito Anopheles).","Vermes: esquistossomose (caramujo), com prevenção por saneamento básico."]],
["Botânica e reprodução","Plantas e reprodução humana.",["Briófitas (sem vasos), pteridófitas (vasos, sem sementes), gimnospermas (sementes nuas) e angiospermas (flores e frutos).","Polinização e dispersão de sementes por animais.","Reprodução humana, métodos contraceptivos e prevenção de ISTs (preservativo é o único que protege)."]]
],

function wrap(t,m){const w=String(t).split(" "),L=[];let c="";for(const x of w){if((c+" "+x).trim().length>m&&c){L.push(c);c=x}else c=(c+" "+x).trim()}if(c)L.push(c);return L}
