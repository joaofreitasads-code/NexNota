const E={
matematica:[
{h:"Porcentagem sem medo",p:["Porcentagem é uma fração de denominador 100: 15% é o mesmo que 15/100, ou 0,15. Para calcular 15% de um valor, basta multiplicar o valor por 0,15.","O jeito mais rápido de resolver aumentos e descontos é usar o fator multiplicativo. Aumentar 10% é multiplicar por 1,10; dar 10% de desconto é multiplicar por 0,90. Quando há vários aumentos e descontos seguidos, você multiplica os fatores, um depois do outro."],f:{t:"flow",items:["Preço inicial: R$ 200","× 1,10 (aumento de 10%)","R$ 220","× 0,90 (desconto de 10%)","Preço final: R$ 198"]},cap:"Aumento e desconto de mesmo percentual não se anulam.",l:"Aumento de i%: multiplique por (1 + i). Desconto de i%: multiplique por (1 − i). Nunca some porcentagens sucessivas."},
{h:"Média, mediana e moda",p:["Essas três medidas resumem um conjunto de dados, e o ENEM gosta de colocá-las lado a lado para ver se você confunde. A média soma tudo e divide pela quantidade. A mediana é o valor do meio, depois de colocar os dados em ordem. A moda é o valor que mais aparece.","No gráfico abaixo estão as notas de um aluno: 6, 8, 8, 9 e 4. A soma é 35, então a média é 7. Em ordem (4, 6, 8, 8, 9), o valor do meio é 8, que também é a moda."],f:{t:"bars",items:[["Prova 1",6],["Prova 2",8],["Prova 3",8],["Prova 4",9],["Prova 5",4]],max:10,line:["Média = 7",7]},cap:"Notas de cinco provas com a linha da média.",l:"Média: soma ÷ quantidade. Mediana: valor central em ordem crescente. Moda: o que mais se repete."},
{h:"Áreas e volumes",p:["Geometria aparece em questões de pisos, terrenos, embalagens e caixas d'água. A área mede a superfície (m²) e o volume mede o espaço ocupado (m³).","Um truque para lembrar: todo sólido reto (prisma e cilindro) tem volume igual à área da base vezes a altura. Pirâmides e cones têm um terço disso. Depois de calcular em m³, lembre que cada 1 m³ equivale a 1.000 litros."],f:{t:"geo"},cap:"As quatro fórmulas de geometria mais usadas na prova.",l:"1 m³ = 1.000 L. Pirâmide e cone: volume = área da base × altura ÷ 3."},
{h:"Contagem e probabilidade",p:["Para contar possibilidades, pergunte primeiro se a ordem importa. Senhas, filas e pódios mudam quando a ordem muda, então são arranjos ou permutações. Comissões, grupos e combinações de sabores não mudam, então são combinações.","Probabilidade é sempre casos favoráveis divididos por casos possíveis. Se dois eventos independentes precisam acontecer juntos, multiplique as probabilidades de cada um."],f:{t:"cards",items:[["Princípio da contagem","Multiplique as opções de cada etapa: 3 camisas e 4 calças dão 12 looks."],["Permutação","Organizar todos os elementos: n! Ex.: 4 pessoas em fila = 24."],["Combinação","Escolher sem ordem: C(n,p). Comissão de 3 entre 6 = 20."],["Probabilidade","Favoráveis ÷ possíveis. Número par no dado = 3/6 = 1/2."]]},cap:"Quatro ferramentas que resolvem quase toda questão de contagem.",l:"Ordem importa: arranjo ou permutação. Ordem não importa: combinação."},
{h:"Funções e a parábola",p:["A função do 1º grau, f(x) = ax + b, vira uma reta. O valor de b é o ponto de partida (uma taxa fixa, por exemplo) e a é quanto cresce a cada unidade.","A função do 2º grau forma uma parábola. Quando a é negativo, a parábola tem a boca para baixo e o vértice é o ponto de máximo, ideal para questões de lucro máximo ou altura máxima de um lançamento."],f:{t:"parabola"},cap:"O vértice da parábola indica o máximo quando a é negativo.",l:"xᵥ = −b / 2a dá a quantidade ótima. yᵥ = −Δ / 4a dá o valor máximo ou mínimo."}
],
portugues:[
{h:"As seis funções da linguagem",p:["Todo texto destaca um dos elementos da comunicação: o assunto, quem fala, quem ouve, o canal, o código ou a própria mensagem. A função predominante é a que corresponde ao elemento em destaque.","No ENEM, as mais cobradas são a conativa (propagandas e campanhas), a metalinguística (textos que explicam a língua) e a poética (poemas e jogos de palavras)."],f:{t:"cards",items:[["Referencial","Informa com objetividade. Foco no assunto. Ex.: notícia."],["Emotiva","Expressa sentimentos. Foco em quem fala. Ex.: diário."],["Conativa","Quer convencer. Foco em quem lê. Ex.: propaganda."],["Fática","Testa o canal. Ex.: Alô? Tá me ouvindo?"],["Metalinguística","A língua explica a língua. Ex.: dicionário."],["Poética","Trabalha a forma: rima, ritmo, sonoridade."]]},cap:"Cada função destaca um elemento diferente da comunicação.",l:"Imperativo e você: conativa. Eu e sentimentos: emotiva. Texto sobre o próprio código: metalinguística."},
{h:"Como interpretar um texto do ENEM",p:["A prova de Linguagens é longa, então método economiza tempo. Leia o enunciado antes do texto para saber o que procurar, e observe a fonte: ela revela o gênero, o autor e a época.","A alternativa correta é sempre sustentada pelo texto. Se uma opção exige informação que o texto não dá, é extrapolação. Palavras absolutas como sempre, nunca, apenas e todos costumam indicar alternativa errada."],f:{t:"flow",items:["Leia o enunciado primeiro","Veja a fonte e o gênero","Encontre a ideia principal","Separe inferência de extrapolação","Marque a mais fiel ao texto"]},cap:"Um roteiro rápido para cada questão de interpretação.",l:"Inferência: o texto autoriza. Extrapolação: vai além do texto. Na dúvida, fique com o que está escrito."},
{h:"Crase na prática",p:["Crase é a junção da preposição a, exigida por um verbo ou nome, com o artigo a, que acompanha palavras femininas. Se faltar um dos dois, não há crase.","O teste mais rápido é trocar a palavra feminina por uma masculina. Se aparecer ao, a crase existe: vou à escola vira vou ao colégio. Se aparecer só o ou a, não existe."],f:{t:"compare",a:["Com crase",["Vou à escola (vou ao colégio)","Refiro-me à professora","Às vezes, à noite, à tarde","Chegou às 8 horas"]],b:["Sem crase",["Antes de masculino: fui a pé","Antes de verbo: começou a estudar","Antes de pronome pessoal: entreguei a ela","Antes de um/uma: assisti a uma aula"]]},cap:"Exemplos de uso obrigatório e proibido do acento grave.",l:"Troque por masculino: se virar ao, tem crase. Macete: vou a, volto da, crase há."},
{h:"A redação nota mil",p:["A redação do ENEM é dissertativo-argumentativa: você defende um ponto de vista sobre um problema social e termina propondo uma solução. São cinco competências que valem até 200 pontos cada.","A estrutura mais segura tem quatro parágrafos. Na introdução, apresente o tema com um repertório e a sua tese. Cada desenvolvimento aprofunda um argumento. A conclusão traz a proposta de intervenção completa."],f:{t:"flow",items:["Introdução: repertório e tese","Desenvolvimento 1: primeiro argumento","Desenvolvimento 2: segundo argumento","Conclusão: proposta de intervenção"]},cap:"Estrutura de quatro parágrafos usada por redações nota mil.",l:"Proposta completa: agente, ação, meio ou modo, finalidade e detalhamento."}
],
literatura:[
{h:"Das origens ao Simbolismo",p:["As escolas literárias se sucedem como reações umas às outras. O Barroco vive o conflito entre fé e razão; o Arcadismo responde com simplicidade; o Romantismo traz emoção e nacionalismo; o Realismo reage com crítica e objetividade.","Não precisa decorar todas as datas. Guarde o marco de cada escola e uma característica forte, como mostra a linha do tempo abaixo."],f:{t:"timeline",items:[["1500","Quinhentismo: Carta de Caminha"],["1601","Barroco: conflito fé e razão"],["1768","Arcadismo: vida no campo"],["1836","Romantismo: emoção e nação"],["1881","Realismo: crítica e ironia"],["1893","Simbolismo: musicalidade"]]},cap:"Marcos iniciais das escolas literárias no Brasil.",l:"1836 Romantismo, 1881 Realismo e Naturalismo, 1893 Simbolismo. O Parnasianismo convive com eles no fim do século XIX."},
{h:"Século XX: do Pré-Modernismo aos contemporâneos",p:["O Pré-Modernismo denuncia problemas do Brasil real, como a Guerra de Canudos em Os Sertões. A Semana de Arte Moderna de 1922 rompe com a tradição e busca uma arte brasileira.","A geração de 30 trouxe o romance regionalista e social, e a de 45 aprofundou a linguagem. Hoje o ENEM valoriza autoras e autores de vozes antes silenciadas, como Conceição Evaristo e Carolina Maria de Jesus."],f:{t:"timeline",items:[["1902","Pré-Modernismo: Os Sertões"],["1922","Semana de Arte Moderna"],["1930","Romance regionalista"],["1945","Clarice e Guimarães Rosa"],["Hoje","Vozes negras, indígenas e periféricas"]]},cap:"Principais momentos da literatura brasileira no século XX.",l:"1ª fase modernista: ruptura e humor. 2ª: regionalismo social. 3ª: experimentação com a linguagem."},
{h:"Romantismo x Realismo",p:["Essa comparação cai muito, porque as duas escolas enxergam o mundo de maneiras opostas. O romântico idealiza o amor, a mulher e a pátria. O realista mostra as pessoas com defeitos, interesses e contradições.","Machado de Assis é o grande nome do Realismo: em Dom Casmurro e Memórias Póstumas de Brás Cubas, a ironia e a análise psicológica desmontam as aparências da sociedade burguesa."],f:{t:"compare",a:["Romantismo",["Emoção e subjetividade","Amor idealizado e mulher perfeita","Nacionalismo e indianismo","Final feliz ou morte por amor"]],b:["Realismo",["Razão e objetividade","Amor por interesse, casamentos por dinheiro","Crítica à sociedade burguesa","Ironia e análise psicológica"]]},cap:"As diferenças mais cobradas entre as duas escolas.",l:"Se o texto idealiza, pense em Romantismo. Se critica com ironia, pense em Realismo."},
{h:"As três gerações românticas",p:["A poesia romântica brasileira se divide em três gerações, cada uma com um tema principal. Reconhecer o tema do poema costuma bastar para acertar a questão.","Na prosa, José de Alencar escreveu romances indianistas, urbanos e regionalistas, criando um retrato idealizado do Brasil."],f:{t:"cards",items:[["1ª geração","Indianismo e nacionalismo. Gonçalves Dias, Canção do Exílio."],["2ª geração","Mal do século: tédio, morte e amor impossível. Álvares de Azevedo."],["3ª geração","Condoreira: poesia social e abolicionista. Castro Alves."]],ch:140},cap:"Cada geração tem um tema dominante.",l:"Índio e pátria: 1ª. Morte e melancolia: 2ª. Abolição e liberdade: 3ª."}
],
artes:[
{h:"A arte ao longo do tempo",p:["Cada período da história da arte reflete os valores de sua época. Na Pré-História, a arte estava ligada à sobrevivência e aos rituais; na Idade Média, à fé; no Renascimento, ao ser humano e à razão.","Olhar a linha do tempo ajuda a entender por que um estilo surgiu como reação ao anterior, como o Barroco dramático depois do equilíbrio renascentista."],f:{t:"timeline",items:[["Pré-História","Pinturas rupestres"],["Antiguidade","Egito, Grécia e Roma"],["Idade Média","Arte religiosa e gótico"],["Séc. XV-XVI","Renascimento"],["Séc. XVII","Barroco"],["1870","Impressionismo de Monet"],["1905+","Vanguardas"]]},cap:"Grandes períodos da arte ocidental.",l:"Renascimento: equilíbrio e razão. Barroco: drama e emoção. Vanguardas: ruptura."},
{h:"Renascimento x Barroco",p:["O Renascimento buscou a harmonia inspirada na Grécia e em Roma, com perspectiva, proporção e o ser humano no centro. Leonardo da Vinci criou o sfumato, sombreado suave sem contornos.","O Barroco, ligado à Contrarreforma, quer emocionar e impactar. Usa contrastes fortes de luz e sombra, diagonais e movimento. No Brasil, Aleijadinho e Mestre Ataíde são os grandes nomes do Barroco mineiro."],f:{t:"compare",a:["Renascimento",["Equilíbrio e simetria","Perspectiva e proporção","Antropocentrismo","Leonardo, Michelangelo, Rafael"]],b:["Barroco",["Drama e emoção","Contraste de luz e sombra","Movimento e diagonais","Caravaggio, Aleijadinho"]]},cap:"Dois estilos vizinhos com propostas opostas.",l:"Calma e simetria: Renascimento. Exagero, sombra e movimento: Barroco."},
{h:"Vanguardas europeias",p:["No início do século XX, artistas romperam com a pintura que imitava a realidade. Cada vanguarda propôs uma nova forma de ver, e o ENEM costuma descrever uma obra para você identificar o movimento.","Associe cada vanguarda a uma palavra-chave e a um artista, como no quadro abaixo."],f:{t:"cards",items:[["Expressionismo","Angústia e emoção com formas distorcidas. Munch."],["Fauvismo","Cores puras e intensas, fora do real. Matisse."],["Cubismo","Formas geométricas e vários ângulos. Picasso."],["Futurismo","Velocidade, máquinas e movimento."],["Dadaísmo","Anti-arte e ready-made. Duchamp."],["Surrealismo","Sonho e inconsciente. Dalí, Magritte."]]},cap:"Uma palavra-chave para cada vanguarda.",l:"Geometria: Cubismo. Sonho: Surrealismo. Objeto comum como arte: Dadaísmo."},
{h:"Arte brasileira moderna e contemporânea",p:["A Semana de 1922 buscou uma arte com a cara do Brasil. Tarsila do Amaral pintou o Abaporu, que inspirou o Movimento Antropofágico: devorar a cultura estrangeira e transformá-la em algo nacional.","Na arte contemporânea, o público deixa de apenas olhar e passa a participar. Hélio Oiticica criou os Parangolés, capas para vestir e dançar, e Lygia Clark fez obras para tocar e manipular."],f:{t:"cards",items:[["Anita Malfatti","Exposição de 1917, precursora do Modernismo."],["Tarsila do Amaral","Abaporu e a Antropofagia."],["Candido Portinari","Retirantes e a denúncia social."],["Hélio Oiticica","Parangolés: arte para vestir."],["Lygia Clark","Obras para o público manipular."],["Tropicália","Mistura de popular, erudito e estrangeiro."]]},cap:"Nomes da arte brasileira mais cobrados.",l:"Antropofagia: absorver o estrangeiro e criar o nacional. Arte contemporânea: participação do público."}
],
sociologia:[
{h:"Os três clássicos da Sociologia",p:["Durkheim, Marx e Weber são a base de quase toda questão de Sociologia. Cada um olha a sociedade por um ângulo: Durkheim pelas regras coletivas, Marx pelo conflito econômico e Weber pelo sentido das ações individuais.","Quando o texto falar de normas que se impõem às pessoas, pense em Durkheim. Exploração e classes apontam para Marx. Tipos de ação e de autoridade, para Weber."],f:{t:"cards",items:[["Durkheim","Fato social, solidariedade mecânica e orgânica, anomia."],["Marx","Luta de classes, mais-valia, alienação, ideologia."],["Weber","Ação social, tipos de dominação, burocracia."]],ch:140},cap:"Os conceitos-chave de cada autor clássico.",l:"Regras coletivas: Durkheim. Conflito e exploração: Marx. Sentido da ação: Weber."},
{h:"O fato social de Durkheim",p:["Para Durkheim, a Sociologia estuda fatos sociais: formas de agir, pensar e sentir que existem antes de nós e que a sociedade impõe. A língua, as leis, a moda e a educação são exemplos.","Ninguém inventou sozinho a língua que fala ou as regras de comportamento na escola. Elas já estavam lá e pressionam cada pessoa a segui-las."],f:{t:"cards",items:[["Exterioridade","Existe fora e antes do indivíduo."],["Coercitividade","Pressiona a pessoa a se adequar."],["Generalidade","É compartilhado por todo o grupo."]],ch:120},cap:"As três características de um fato social.",l:"Exterior, coercitivo e geral: se tiver as três características, é fato social."},
{h:"Do fordismo à uberização",p:["A forma de organizar o trabalho mudou muito no último século. O fordismo trouxe a linha de montagem e a produção em massa. O toyotismo trocou isso por produção flexível e sob demanda.","Hoje se fala em uberização: trabalho por aplicativos, com horários flexíveis mas sem direitos como férias e 13º salário. O ENEM costuma relacionar esse tema à precarização do trabalho."],f:{t:"timeline",items:[["1910","Taylorismo e fordismo: linha de montagem"],["1970","Toyotismo: produção flexível"],["2010","Uberização: trabalho por aplicativo"]]},cap:"Transformações na organização do trabalho.",l:"Fordismo: em massa e em série. Toyotismo: just in time. Uberização: sem vínculo e sem direitos."},
{h:"Cidadania e direitos",p:["O sociólogo T. H. Marshall mostrou que a cidadania foi conquistada em etapas. Primeiro vieram as liberdades individuais, depois o direito de participar da política e, por último, os direitos que garantem bem-estar.","No Brasil, a Constituição de 1988, chamada de Constituição Cidadã, reuniu esses direitos e ampliou garantias sociais como o SUS e a educação pública."],f:{t:"flow",items:["Séc. XVIII: direitos civis (liberdade, propriedade)","Séc. XIX: direitos políticos (votar e ser votado)","Séc. XX: direitos sociais (saúde, educação)"]},cap:"A ordem histórica dos direitos segundo Marshall.",l:"Civis: liberdade. Políticos: voto. Sociais: saúde, educação e previdência."}
],
filosofia:[
{h:"Linha do tempo da Filosofia",p:["A Filosofia nasceu na Grécia quando os pensadores trocaram as explicações míticas pela razão. Desde então, cada período fez perguntas diferentes: o que é a natureza, como devemos viver, como conhecemos e como devemos nos organizar.","Situar o filósofo na linha do tempo ajuda a entender o problema que ele tentava resolver."],f:{t:"timeline",items:[["Séc. VI a.C.","Pré-socráticos: a origem de tudo"],["Séc. V-IV a.C.","Sócrates, Platão, Aristóteles"],["Idade Média","Agostinho e Tomás de Aquino"],["Séc. XVII-XVIII","Descartes, Locke, Kant"],["Séc. XIX-XX","Nietzsche, Sartre, Arendt"]]},cap:"Grandes períodos da Filosofia ocidental.",l:"Antiga: natureza e ética. Medieval: fé e razão. Moderna: conhecimento e política. Contemporânea: crítica e existência."},
{h:"A alegoria da caverna",p:["Platão imaginou prisioneiros acorrentados dentro de uma caverna, que só enxergam sombras projetadas na parede e acreditam que elas são a realidade. Um deles se liberta, sai da caverna e vê o mundo iluminado pelo Sol.","A caverna representa o mundo sensível, das aparências e opiniões. O lado de fora representa o mundo das ideias, onde está o verdadeiro conhecimento. Sair da caverna é o caminho da educação filosófica."],f:{t:"cave"},cap:"Os elementos da alegoria e o que cada um representa.",l:"Sombras: opinião e aparência. Sol: o Bem e o conhecimento verdadeiro."},
{h:"Os contratualistas",p:["Hobbes, Locke e Rousseau explicam o Estado por um contrato entre as pessoas. Todos partem de um estado de natureza, anterior à sociedade, mas cada um o imagina de um jeito.","Por isso chegam a conclusões diferentes: Hobbes defende um poder forte, Locke defende a proteção dos direitos individuais e Rousseau defende a soberania do povo."],f:{t:"cards",items:[["Hobbes","Guerra de todos contra todos. Estado forte (Leviatã) para garantir segurança."],["Locke","Direitos naturais: vida, liberdade e propriedade. Governo pode ser deposto."],["Rousseau","O homem nasce bom. Soberania da vontade geral do povo."]],ch:150},cap:"Três visões do estado de natureza e do contrato social.",l:"Hobbes: segurança. Locke: propriedade e liberdade. Rousseau: vontade geral."},
{h:"Racionalismo x Empirismo",p:["A grande pergunta da filosofia moderna foi: de onde vem o conhecimento? Para os racionalistas, da razão. Para os empiristas, da experiência dos sentidos.","Kant tentou resolver o debate: o conhecimento começa com a experiência, mas é organizado por estruturas da própria mente. Por isso sua filosofia se chama criticismo."],f:{t:"compare",a:["Racionalismo",["A razão é a fonte segura","Ideias inatas","Descartes: penso, logo existo","Método: dúvida metódica"]],b:["Empirismo",["A experiência é a fonte","Mente como tábula rasa","Locke e Hume","Método: observação"]]},cap:"As duas respostas sobre a origem do conhecimento.",l:"Razão: Descartes. Experiência: Locke e Hume. Síntese das duas: Kant."}
],
historia:[
{h:"Brasil Colônia",p:["Durante mais de três séculos, o Brasil foi colônia de Portugal, organizado para enriquecer a metrópole. A economia passou pelo pau-brasil, pelo açúcar no Nordeste e pelo ouro em Minas Gerais.","A base do trabalho foi a escravização de africanos e indígenas, que resistiram de muitas formas, como nos quilombos. No fim do período, revoltas como a Inconfidência Mineira questionaram o domínio português."],f:{t:"timeline",items:[["1500","Chegada dos portugueses"],["1530","Ciclo do açúcar"],["1695","Queda de Palmares"],["1700s","Ciclo do ouro"],["1789","Inconfidência Mineira"],["1808","Chegada da família real"]]},cap:"Principais marcos do período colonial.",l:"Açúcar no Nordeste (séc. XVI-XVII), ouro em Minas (séc. XVIII), escravidão como base de tudo."},
{h:"Brasil Império",p:["Depois da Independência, o Brasil foi uma monarquia por 67 anos. O Período Regencial foi marcado por revoltas nas províncias, como a Farroupilha, no Rio Grande do Sul.","No Segundo Reinado, o café se tornou o principal produto e a escravidão foi abolida aos poucos, por pressão inglesa e dos movimentos abolicionistas, até a Lei Áurea."],f:{t:"timeline",items:[["1822","Independência"],["1835","Revolução Farroupilha"],["1850","Fim do tráfico negreiro"],["1864","Guerra do Paraguai"],["1888","Lei Áurea"],["1889","Proclamação da República"]]},cap:"Do Primeiro Reinado ao fim da monarquia.",l:"Abolição gradual: 1850 tráfico, 1871 Ventre Livre, 1885 Sexagenários, 1888 Lei Áurea."},
{h:"Brasil República",p:["A República começou dominada pelas oligarquias do café e do leite, com coronelismo e voto de cabresto. Em 1930, Getúlio Vargas chegou ao poder e criou leis trabalhistas, como a CLT.","Em 1964, um golpe instaurou a Ditadura Militar, que durou até 1985, com censura e repressão, principalmente depois do AI-5. A redemocratização culminou na Constituição de 1988."],f:{t:"timeline",items:[["1889","República Velha"],["1930","Era Vargas"],["1964","Golpe militar"],["1968","AI-5"],["1984","Diretas Já"],["1988","Constituição Cidadã"]]},cap:"Os períodos da República brasileira.",l:"Vargas: CLT e Estado Novo. Ditadura: AI-5 e censura. 1988: Constituição Cidadã."},
{h:"Guerra Fria",p:["Depois da Segunda Guerra, Estados Unidos e União Soviética disputaram a liderança mundial. Nunca lutaram diretamente, mas competiram em armas nucleares, tecnologia, corrida espacial e influência sobre outros países.","Os conflitos armados aconteceram em outros territórios, como Coreia e Vietnã. A Guerra Fria terminou com a queda do Muro de Berlim (1989) e o fim da URSS (1991)."],f:{t:"compare",a:["Estados Unidos",["Capitalismo","Democracia liberal","OTAN","Plano Marshall"]],b:["União Soviética",["Socialismo","Partido único","Pacto de Varsóvia","Economia planificada"]]},cap:"Os dois blocos da Guerra Fria.",l:"Bipolaridade sem guerra direta entre as superpotências. Fim em 1991."}
],
geografia:[
{h:"Coordenadas e fusos horários",p:["Para localizar qualquer ponto na Terra usamos duas medidas. A latitude indica a distância em graus até a Linha do Equador; a longitude, a distância até o Meridiano de Greenwich.","Como a Terra gira 360° em 24 horas, cada 15° de longitude correspondem a 1 hora de diferença. Quem está a leste vê o Sol nascer primeiro, por isso seu horário é adiantado."],f:{t:"globe"},cap:"Linhas de referência do globo terrestre.",l:"Leste adianta, oeste atrasa. Diferença de horas = diferença de longitude ÷ 15."},
{h:"Biomas brasileiros",p:["O Brasil tem seis biomas terrestres, cada um com clima, vegetação e problemas ambientais próprios. O ENEM cobra muito os impactos do desmatamento e da expansão agrícola sobre eles.","A Caatinga é o único exclusivamente brasileiro. A Mata Atlântica é o mais devastado. O Cerrado é chamado de berço das águas por abrigar nascentes de grandes rios."],f:{t:"cards",items:[["Amazônia","Floresta equatorial, maior biodiversidade do planeta."],["Cerrado","Savana, berço das águas, pressionado pela soja."],["Caatinga","Semiárido, único bioma só do Brasil."],["Mata Atlântica","O mais devastado. Resta pouco da cobertura original."],["Pantanal","Maior planície alagável do mundo."],["Pampa","Campos do sul, pecuária."]]},cap:"Os seis biomas e uma característica marcante de cada um.",l:"Só do Brasil: Caatinga. Mais devastado: Mata Atlântica. Berço das águas: Cerrado."},
{h:"Inversão térmica",p:["Normalmente o ar perto do solo é mais quente, sobe e leva a poluição para cima, onde ela se dispersa. Em manhãs frias de inverno, porém, pode se formar uma camada de ar quente mais alta, que funciona como uma tampa.","O ar frio e a poluição ficam presos junto ao solo, aumentando os casos de doenças respiratórias. Não confunda com ilha de calor, que é o aquecimento das áreas urbanas por causa do asfalto e do concreto."],f:{t:"inversion"},cap:"Circulação normal do ar comparada à inversão térmica.",l:"Inversão térmica: inverno, ar frio preso embaixo, poluição concentrada. Ilha de calor: cidade mais quente que o campo."},
{h:"Transição demográfica",p:["Com urbanização, acesso a métodos contraceptivos e maior participação da mulher no mercado de trabalho, as famílias brasileiras passaram a ter menos filhos. Ao mesmo tempo, a expectativa de vida aumentou.","O resultado é o envelhecimento da população: a pirâmide etária estreita na base e alarga no topo. Isso traz desafios para a previdência e a saúde pública."],f:{t:"agepyr"},cap:"Mudança no formato da pirâmide etária.",l:"Menos nascimentos + vidas mais longas = população envelhecida."}
],
quimica:[
{h:"O átomo",p:["Todo átomo tem um núcleo, com prótons e nêutrons, e uma eletrosfera, onde ficam os elétrons. O número de prótons, chamado número atômico (Z), identifica o elemento químico.","O número de massa (A) é a soma de prótons e nêutrons. Átomos do mesmo elemento com números de nêutrons diferentes são isótopos, como o carbono-12 e o carbono-14, usado na datação de fósseis."],f:{t:"atom"},cap:"Estrutura básica de um átomo.",l:"Z = prótons. A = prótons + nêutrons. Isótopos têm o mesmo Z."},
{h:"A escala de pH",p:["O pH indica se uma solução é ácida, neutra ou básica, numa escala de 0 a 14 a 25 °C. Quanto menor o pH, mais ácida; quanto maior, mais básica.","Questões do ENEM relacionam pH a situações reais: antiácidos que neutralizam o estômago, calagem para corrigir solos ácidos e chuva ácida afetando lagos e monumentos."],f:{t:"ph"},cap:"Escala de pH com exemplos do cotidiano.",l:"pH < 7 ácido, pH = 7 neutro, pH > 7 básico. Ácido + base → sal + água."},
{h:"Soluções e diluição",p:["Uma solução é uma mistura homogênea de soluto (o que dissolve) e solvente (quem dissolve). A concentração diz quanto soluto há em cada litro de solução.","Ao diluir, acrescentamos solvente: o volume aumenta, a concentração diminui, mas a quantidade de soluto continua a mesma. Por isso vale a relação C₁·V₁ = C₂·V₂."],f:{t:"board",items:["C = m / V  (g/L)","M = n / V  (mol/L)","n = m / M","C₁ · V₁ = C₂ · V₂"]},cap:"As fórmulas de soluções mais usadas.",l:"Dobrou o volume na diluição, a concentração cai pela metade."},
{h:"Funções orgânicas",p:["A química orgânica estuda compostos de carbono: combustíveis, alimentos, remédios e plásticos. Cada função é reconhecida por um grupo de átomos característico.","No ENEM, é comum aparecer a fórmula de um remédio ou de uma substância natural para você identificar as funções presentes."],f:{t:"cards",items:[["Álcool","–OH em carbono saturado. Ex.: etanol."],["Ácido carboxílico","–COOH. Ex.: ácido acético (vinagre)."],["Éster","–COO–. Aromas de frutas."],["Aldeído","–CHO na ponta da cadeia. Ex.: formol."],["Cetona","C=O no meio da cadeia. Ex.: acetona."],["Amina","Nitrogênio ligado a carbono. Ex.: anilina."]]},cap:"Grupos funcionais mais cobrados.",l:"–OH álcool, –COOH ácido carboxílico, C=O no meio cetona, C=O na ponta aldeído."}
],
fisica:[
{h:"As três Leis de Newton",p:["As Leis de Newton explicam por que os corpos se movem. Elas aparecem em questões sobre cinto de segurança, freadas, foguetes e esportes.","Um detalhe importante: na terceira lei, ação e reação agem em corpos diferentes, por isso não se anulam."],f:{t:"cards",items:[["1ª Lei: Inércia","Sem força resultante, o corpo mantém repouso ou velocidade. Cinto de segurança."],["2ª Lei: F = m · a","Quanto maior a força, maior a aceleração. Massa maior, menor aceleração."],["3ª Lei: Ação e reação","Toda ação gera uma reação igual e oposta. Foguete, nado."]],ch:150},cap:"Resumo das Leis de Newton com exemplos.",l:"Inércia: tendência a continuar. F = m·a. Ação e reação: forças em corpos diferentes."},
{h:"Conservação de energia",p:["Energia não se cria nem se perde, apenas se transforma. Numa montanha-russa sem atrito, a energia potencial do topo vira energia cinética na descida, e a soma das duas permanece a mesma.","Na vida real parte da energia vira calor por atrito. Usinas também seguem essa lógica: a hidrelétrica transforma a energia potencial da água em energia elétrica."],f:{t:"coaster"},cap:"Transformação de energia em uma montanha-russa.",l:"Ep = m·g·h. Ec = m·v²/2. Sem atrito, Ep + Ec não muda."},
{h:"Ondas",p:["Onda é uma perturbação que transporta energia sem transportar matéria. O som é uma onda mecânica, precisa de um meio para se propagar. A luz é eletromagnética e se propaga até no vácuo.","A velocidade de uma onda é o produto do comprimento de onda pela frequência. A frequência depende da fonte e não muda quando a onda troca de meio."],f:{t:"wave"},cap:"Elementos de uma onda.",l:"v = λ·f. Som não se propaga no vácuo; luz sim."},
{h:"Circuitos elétricos",p:["Eletricidade é o tema de Física mais cobrado no ENEM. Na ligação em série, os componentes ficam no mesmo caminho e a corrente é a mesma. Na ligação em paralelo, cada um tem seu caminho e recebe a mesma tensão.","As instalações das casas são em paralelo: todos os aparelhos recebem 127 V ou 220 V e funcionam de forma independente. Para calcular o consumo, multiplique a potência em kW pelo tempo em horas."],f:{t:"circuit"},cap:"Comparação entre ligação em série e em paralelo.",l:"U = R·i. P = U·i. Consumo (kWh) = potência (kW) × tempo (h)."}
],
biologia:[
{h:"A célula",p:["A célula é a menor unidade viva. As células eucarióticas, como as nossas, têm núcleo e várias organelas, cada uma com uma função, como os órgãos de um corpo.","Para o ENEM, as mais importantes são a mitocôndria, que produz energia, os ribossomos, que produzem proteínas, e o núcleo, que guarda o material genético."],f:{t:"cell"},cap:"Principais estruturas de uma célula animal.",l:"Mitocôndria: energia. Ribossomo: proteína. Núcleo: DNA. Cloroplasto só em plantas: fotossíntese."},
{h:"Cadeia alimentar e energia",p:["Os produtores, como plantas e algas, captam a energia do Sol pela fotossíntese. Essa energia passa para os consumidores primários, secundários e terciários, e os decompositores reciclam a matéria de todos.","A cada nível, cerca de 90% da energia se perde como calor. Por isso há menos energia no topo da pirâmide. Já substâncias tóxicas, como o mercúrio, fazem o caminho inverso e se acumulam nos predadores."],f:{t:"pyramid",items:["Consumidor terciário","Consumidor secundário","Consumidor primário","Produtores (fotossíntese)"]},cap:"Pirâmide de energia de uma cadeia alimentar.",l:"Energia: flui em um só sentido e diminui. Poluentes: se acumulam no topo (magnificação trófica)."},
{h:"Genética: o quadro de Punnett",p:["Cada característica é determinada por um par de alelos, um vindo de cada genitor. O alelo dominante (A) se manifesta mesmo em dose única; o recessivo (a) só aparece em dupla (aa).","O quadro de Punnett mostra todas as combinações possíveis. No cruzamento de dois heterozigotos, há 1 chance em 4 de o filho ser aa."],f:{t:"punnett"},cap:"Cruzamento entre dois heterozigotos (Aa × Aa).",l:"Aa × Aa: 3 dominantes para 1 recessivo. Probabilidade de aa = 1/4."},
{h:"Fotossíntese e respiração",p:["Fotossíntese e respiração celular são processos complementares. Na fotossíntese, as plantas usam luz, gás carbônico e água para produzir glicose e liberar oxigênio.","Na respiração, os seres vivos, inclusive as plantas, usam glicose e oxigênio para obter energia, devolvendo gás carbônico e água ao ambiente. Assim a matéria circula na natureza."],f:{t:"cycle",center:"Ciclo da energia",items:["Luz + CO₂ + H₂O","Fotossíntese no cloroplasto","Glicose + O₂","Respiração na mitocôndria"]},cap:"Como fotossíntese e respiração se completam.",l:"Fotossíntese: produz glicose e O₂. Respiração: consome glicose e O₂ e libera energia."}
]

function quiz(p,items,api,doneLabel){
  p.innerHTML=`<div class="score" id="score"></div><div id="qs">${items.map((it,n)=>`<article class="q" data-n="${n}">
  <p class="qh">Questão ${n+1}${it.tag?`<span class="tag">${it.tag}</span>`:""}</p><p class="en">${esc(it.q[0])}</p>
  <div class="opts">${it.q[1].map((o,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b><span>${esc(o)}</span></button>`).join("")}</div>
  <div class="ex" aria-live="polite"></div></article>`).join("")}</div><div id="done"></div>`;
  const arts=[...p.querySelectorAll(".q")];
  let armed=false,wasDone=null;
  function paint(n){
    const it=items[n],a=api.get(it.key),el=arts[n],c=it.q[2],ans=a!==undefined;
    el.querySelectorAll(".opt").forEach((b,i)=>{b.className="opt";b.disabled=ans;
      if(ans){if(i===c)b.classList.add("ok");else if(i===a)b.classList.add("bad");else b.classList.add("dim")}});
    el.classList.toggle("is-ok",ans&&a===c);el.classList.toggle("is-bad",ans&&a!==c);
    const ex=el.querySelector(".ex");
    if(!ans){ex.hidden=true;ex.innerHTML=""}
    else{ex.hidden=false;ex.innerHTML=`<strong>${a===c?"Você acertou!":"Você errou. A resposta certa é a "+L[c]+"."}</strong> ${esc(it.q[3])}`}
  }
  function score(){
    let ok=0,bad=0;items.forEach(it=>{const a=api.get(it.key);if(a!==undefined)a===it.q[2]?ok++:bad++});
    const rest=items.length-ok-bad;
    $("#score").innerHTML=`<div class="sc ok"><strong>${ok}</strong>${ok===1?"acerto":"acertos"}</div><div class="sc bad"><strong>${bad}</strong>${bad===1?"erro":"erros"}</div><div class="sc"><strong>${rest}</strong>${rest===1?"restante":"restantes"}</div>
    <div class="sa"><button class="btn" id="redo"${bad?"":" disabled"}>Refazer as erradas</button><button class="btn" id="reset"${ok+bad?"":" disabled"}>Recomeçar</button></div>`;
    $("#redo").onclick=()=>{items.forEach(it=>{const a=api.get(it.key);if(a!==undefined&&a!==it.q[2])api.del(it.key)});items.forEach((_,n)=>paint(n));score();
      const f=arts.find(x=>!x.classList.contains("is-ok"));if(f)f.scrollIntoView({block:"center"})};
    const r=$("#reset");
    r.onclick=()=>{if(!armed){armed=true;r.textContent="Clique de novo para apagar";setTimeout(()=>{armed=false;if(r.isConnected)r.textContent="Recomeçar"},3000);return}
      armed=false;items.forEach(it=>api.del(it.key));items.forEach((_,n)=>paint(n));score();window.scrollTo(0,0)};
    const d=$("#done"),finished=rest===0;
    if(finished){const pct=Math.round(ok/items.length*100);
      d.innerHTML=`<div class="stamp-wrap"><p class="stamp mk${wasDone===false?" pop":""}">${esc(doneLabel)}</p><p>Você acertou ${ok} de ${items.length} questões (${pct}%). ${pct>=70?"Mandou bem! Revise só as que errou.":"Volte aos assuntos abordados e refaça as erradas."}</p></div>`;
      if(wasDone===false)d.scrollIntoView({block:"center"});
    }else d.innerHTML="";
    wasDone=finished;
  }
  p.querySelector("#qs").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;
    const n=+b.closest(".q").dataset.n;api.set(items[n].key,+b.dataset.i);paint(n);score()});
  arts.forEach((_,n)=>paint(n));score();
}

const IMG={},G="#0E7A43",GL="#E3F5EA",INK="#14281D",MU="#5B7265",FF='"Lexend", system-ui, sans-serif';
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function cl(x,t,w){const ws=String(t).split(" "),L=[];let c="";for(const p of ws){const tt=c?c+" "+p:p;if(x.measureText(tt).width>w&&c){L.push(c);c=p}else c=tt}if(c)L.push(c);return L}
function newC(){const c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,1080,1350);return[c,x]}
function head(x,sub,title){x.font=`700 60px ${FF}`;const L=cl(x,title,940),h=150+L.length*72;x.fillStyle=G;x.fillRect(0,0,1080,h);x.fillStyle="#BFE9CF";x.font=`500 30px ${FF}`;x.fillText(sub,70,86);x.fillStyle="#fff";x.font=`700 60px ${FF}`;L.forEach((l,i)=>x.fillText(l,70,158+i*72));return h}

const SVGCSS='.tI{fill:#14281D}.tW{fill:#fff}.tM{fill:#4B6356}.tG{fill:#0E7A43}.tB{fill:#B42318}.tBl{fill:#6D5BD0}.bG{fill:#0E7A43}.bL{fill:#D8F3E2}.bC{fill:#fff;stroke:#CFE3D6;stroke-width:2}.bC0{fill:#fff}.bLine{fill:#CFE3D6}.bSh{fill:#4B6356;opacity:.45}.bSh2{fill:#4B6356}.bInk{fill:#14281D}.bCold{fill:#60A5FA;opacity:.22}.bHot{fill:#F59E0B;opacity:.3}.sG{stroke:#0E7A43;fill:none;stroke-width:3}.sL{stroke:#CFE3D6;fill:none;stroke-width:2}.sSm{fill:none;stroke:#4B6356;stroke-width:7;stroke-linecap:round;opacity:.55}text{font-family:Lexend,Arial,Helvetica,sans-serif}';

function svgImg(spec){return new Promise(res=>{try{let v=F[spec.t](spec);const m=v.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);v=v.replace(/var\(--(\w+)\)/g,(a,k)=>VARS[k]||"#0E7A43").replace('<svg ',`<svg width="${m[1]*2}" height="${m[2]*2}" `).replace('<defs>',`<style>${SVGCSS}</style><defs>`);const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(v)}catch(e){res(null)}})}
function topicImg(s,t,i,n,fig,mh=430){const[c,x]=newC();const hh=head(x,`${s.n}  |  Resumo ${i+1} de ${n}`,t[0]);let top=hh+50;const bottom=1215;
  if(fig){const sc=Math.min(940/fig.width,mh/fig.height),fw=fig.width*sc,fh=fig.height*sc;x.fillStyle="#F6FBF8";rr(x,70,top-10,940,fh+20,20);x.fill();x.drawImage(fig,70+(940-fw)/2,top,fw,fh);top+=fh+46}
  const run=(f,draw)=>{let y=top;const lh=f*1.45;x.font=`400 ${f}px ${FF}`;x.fillStyle=INK;cl(x,t[1],940).forEach(l=>{if(draw)x.fillText(l,70,y+f);y+=lh});y+=f*1.1;
    x.font=`700 ${f}px ${FF}`;x.fillStyle=G;if(draw)x.fillText("Pontos-chave",70,y+f);y+=lh+6;
    t[2].forEach((p,k)=>{x.font=`400 ${f}px ${FF}`;const L=cl(x,p,860);if(draw){x.fillStyle=G;x.beginPath();x.arc(94,y+f*.62,f*.74,0,7);x.fill();x.fillStyle="#fff";x.font=`700 ${Math.round(f*.8)}px ${FF}`;x.textAlign="center";x.fillText(k+1,94,y+f*.9);x.textAlign="left";x.font=`400 ${f}px ${FF}`;x.fillStyle=INK;L.forEach((l,j)=>x.fillText(l,150,y+f+j*lh))}y+=L.length*lh+f*.55});
    if(t[3]){y+=f*.4;x.font=`700 ${f}px ${FF}`;const FL=[];t[3].forEach(q=>cl(x,q,860).forEach(l=>FL.push(l)));const bh=f*2.3+FL.length*lh;
      if(draw){x.fillStyle=GL;rr(x,70,y,940,bh,24);x.fill();x.fillStyle=G;rr(x,70,y,14,bh,7);x.fill();x.font=`700 ${Math.round(f*.85)}px ${FF}`;x.fillText(s.fl||"Para memorizar",112,y+f*1.5);x.fillStyle=INK;x.font=`700 ${f}px ${FF}`;FL.forEach((l,j)=>x.fillText(l,112,y+f*1.5+lh*(j+1)))}y+=bh}
